<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alex’s Pilot Academy: Math 6, Term 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5fb;--panel:#ffffff;--ink:#14213d;--soft:#4a5a75;--accent:#DD0426;--accent-ink:#ffffff;--navy:#0b2545;--line:#cfdceb;--good:#22E05A;--good-ink:#04210f;--bad:#FF2D3F;--gold:#f2b705;--sky1:#9fd0f5;--sky2:#e8f4fd;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1627;--panel:#15233b;--ink:#eef4fb;--soft:#b5c4da;--accent:#ff5a73;--accent-ink:#1a0007;--navy:#d7e6fb;--line:#2b3f5e;--sky1:#1c3a63;--sky2:#14284a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:19px;line-height:1.45}
#app{max-width:1280px;margin:0 auto;padding:14px 16px 70px}
h1,h2,h3{font-family:Fredoka,sans-serif;font-weight:600;margin:0}
button{font:inherit;font-weight:800;font-size:19px;border:0;border-radius:12px;padding:10px 20px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
button.ghost{background:transparent;color:var(--ink);border:3px solid var(--line)}
button.navy{background:var(--navy);color:var(--bg)}
button:disabled{opacity:.5;cursor:not-allowed}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 2px}
.brand{display:flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-weight:600;font-size:24px}
.brand img{height:40px}
.userchip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:18px;color:var(--soft)}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px 28px 90px;background:linear-gradient(180deg,var(--sky1),var(--sky2));margin-top:8px;border:2px solid var(--line)}
.hero h1{font-size:40px;color:var(--navy)}
.hero p{margin:6px 0 0;font-size:21px;color:var(--ink);font-weight:700}
.hero svg.jet{position:absolute;right:20px;bottom:6px;width:min(46%,420px);height:auto}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 16px;font-weight:800}
.stat b{font-size:26px;font-family:Fredoka,sans-serif;color:var(--accent);display:block;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:18px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px}
.item h3{font-size:24px;margin:8px 0 2px}
.item .sub{color:var(--soft);font-weight:700;margin:0}
.chip{display:inline-block;border-radius:999px;padding:2px 12px;font-weight:800;font-size:16px;background:var(--navy);color:var(--bg)}
.chip.hw{background:#1f6fd1;color:#fff}.chip.exam{background:var(--accent);color:var(--accent-ink)}.chip.term{background:#6b2fb3;color:#fff}.chip.project{background:#0f8a5f;color:#fff}
.status{font-weight:800;margin-top:10px;font-size:19px}
.status.done{color:#0a8a37}.status.prog{color:#b36a00}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.meta{color:var(--soft);font-size:17px;font-weight:700;margin-top:6px}
table.gb{width:100%;border-collapse:collapse;margin-top:10px;font-size:18px}
table.gb th,table.gb td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
.runner{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:12px}
@media (max-width:980px){.runner{grid-template-columns:1fr}}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.timer{font-family:Fredoka,sans-serif;font-size:24px;font-weight:600}
.timer.over{color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pill{min-width:42px;height:42px;padding:0 8px;border-radius:10px;font-size:17px;background:var(--panel);color:var(--ink);border:3px solid var(--line)}
.pill.ans{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.pill.flag{border-color:var(--gold);box-shadow:inset 0 0 0 3px var(--gold)}
.pill.ok{background:var(--good);color:var(--good-ink);border-color:#00A63C}
.pill.bad{background:var(--bad);color:#fff;border-color:#C4001A}
.pill.cur{outline:4px solid var(--gold);outline-offset:2px}
.qnum{font-weight:800;color:var(--soft)}
.qtext{font-size:25px;font-weight:800;margin:10px 0;line-height:1.35}
.fig{margin:10px 0;max-width:560px;color:var(--ink)}.fig svg{width:100%;height:auto;display:block}
.scenario{background:var(--bg);border:2px dashed var(--gold);border-radius:14px;padding:12px 16px;margin:10px 0;font-weight:700}
input[type=text],textarea{width:100%;font:inherit;font-size:26px;font-weight:800;padding:10px 14px;border-radius:12px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{font-size:21px;font-weight:700;min-height:150px;resize:vertical}
input.good{background:var(--good);color:var(--good-ink);border-color:#00A63C}
input.bad{background:var(--bad);color:#fff;border-color:#C4001A}
.tip{color:var(--soft);font-size:17px;margin:6px 0 0;font-weight:700}
.choices{display:grid;gap:10px;margin-top:8px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);color:var(--ink);border:3px solid var(--line);font-size:22px}
.choice .k{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;background:var(--panel);border:2px solid var(--line);font-weight:800}
.choice.sel{border-color:var(--navy);background:var(--panel);box-shadow:inset 0 0 0 3px var(--navy)}
.choice.good{background:var(--good);color:var(--good-ink);border-color:#00A63C}
.choice.bad{background:var(--bad);color:#fff;border-color:#C4001A}
.msg{display:none;margin-top:12px;padding:12px 16px;border-radius:12px;font-weight:800;font-size:21px}
.msg.show{display:block}.msg.good{background:var(--good);color:var(--good-ink)}.msg.bad{background:var(--bad);color:#fff}
.msg small{display:block;font-size:19px;font-weight:700;margin-top:4px}
details.ref{margin-top:14px;border:2px solid var(--line);border-radius:14px;padding:2px 14px;background:var(--bg)}
details.ref summary{cursor:pointer;font-family:Fredoka,sans-serif;font-weight:600;font-size:21px;color:var(--accent);padding:8px 0}
details.ref h4{font-family:Fredoka,sans-serif;font-size:20px;margin:10px 0 2px;color:var(--navy)}
details.ref ul,details.ref ol,.manual ul,.manual ol{margin:0 0 10px;padding-left:24px}details.ref li,.manual li{margin:5px 0}
.work{position:sticky;top:10px}
.wtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.wtools button{padding:6px 14px;font-size:17px}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);padding:0}
.dot.sel{box-shadow:0 0 0 4px var(--gold)}
.wbox{position:relative;width:100%;border:3px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;touch-action:none}
.wbox.blank{background-image:radial-gradient(#b8c7da 1.3px,transparent 1.3px);background-size:26px 26px}
.wbox svg{position:absolute;inset:0;width:100%;height:100%}
.wbox canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center;justify-content:space-between}
.review .rq{border-bottom:2px solid var(--line);padding:12px 0}
.review .ok{color:#0a8a37;font-weight:800}.review .no{color:#c4001a;font-weight:800}
.big{font-family:Fredoka,sans-serif;font-size:56px;color:var(--accent);line-height:1}
#modal{position:fixed;inset:0;background:rgba(5,15,35,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.dlg{background:var(--panel);border-radius:20px;padding:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto;border:3px solid var(--line)}
.dlg h2{font-size:28px;margin-bottom:8px}
.warn{background:var(--bg);border:2px solid var(--gold);border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:700}
.signin{max-width:560px;margin:60px auto;text-align:center}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;border-bottom:3px solid var(--line);padding-bottom:0}
.tab{background:var(--panel);color:var(--ink);border:3px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:10px 18px;font-size:19px;margin-bottom:-3px}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.modh{font-size:26px;margin:22px 2px 0;color:var(--navy)}
.stars{display:flex;gap:2px;margin-top:6px}
.idea{font-size:22px;font-weight:700}
.manual h3{font-size:22px;margin:12px 0 4px;color:var(--navy)}
.pchip{display:inline-block;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 14px;margin-left:6px;font-weight:800;font-size:18px}
.qdots{display:flex;flex-wrap:wrap;gap:8px;margin:12px 2px}
.qdot{width:22px;height:22px;border-radius:50%;background:var(--line);border:3px solid transparent}
.qdot.ok{background:#22E05A}.qdot.miss{background:#FF2D3F}
.qdot.redo{border:3px dashed var(--soft)}.qdot.redo.ok,.qdot.redo.miss{border-color:transparent}
.qdot.now{box-shadow:0 0 0 4px var(--gold)}
.redotag{display:inline-block;margin-left:6px;padding:1px 10px;border-radius:999px;background:var(--gold);color:#3b2a00;font-size:16px;font-weight:800}
.prize{margin-top:12px;background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:12px;font-size:19px;line-height:1.4}
</style>
</head>

<div id="modal" hidden></div>
<script>
/* ===== CONFIG (teacher can edit) ===== */
const CFG={"student": "Alex", "weights": {"hw": 40, "exam": 40, "end": 20}, "teacherCode": "SEFNTUVSMjY="};
const ITEMS=[{"id": "hw2", "type": "hw", "cat": "hw", "title": "Homework 1: Fuel Fractions", "sub": "Module 2: Fractions", "min": 50, "when": "Use during Module 2", "mods": ["m2"]}, {"id": "ex2", "type": "exam", "cat": "exam", "title": "Exam 1: Pilot Test 1", "sub": "Module 2: Fractions", "min": 60, "when": "End of Module 2", "mods": ["m2"], "code": "UlVOV0FZMQ=="}, {"id": "hw3", "type": "hw", "cat": "hw", "title": "Homework 2: Altitude and Airspeed", "sub": "Modules 3 and 4: Rational Numbers, Ratios and Rates", "min": 50, "when": "Use during Modules 3 and 4", "mods": ["m3", "m4"]}, {"id": "exB", "type": "exam", "cat": "exam", "title": "Exam 2: Pilot Test 2", "sub": "Modules 3 and 4: Rational Numbers, Ratios and Rates", "min": 60, "when": "End of Module 4", "mods": ["m3", "m4"], "code": "UlVOV0FZMg=="}, {"id": "hw4", "type": "hw", "cat": "hw", "title": "Homework 3: Percent Power", "sub": "Module 5: Percentages", "min": 50, "when": "Use during Module 5", "mods": ["m5"]}, {"id": "ex4", "type": "exam", "cat": "exam", "title": "Exam 3: Pilot Test 3", "sub": "Module 5: Percentages", "min": 60, "when": "End of Module 5", "mods": ["m5"], "code": "UlVOV0FZMw=="}, {"id": "proj", "type": "project", "cat": "end", "title": "Term 1 Project: Skyline Air Launch", "sub": "Modules 1 to 5", "min": 90, "when": "Start late in Term 1, finish before the final exam", "mods": ["m1", "m2", "m3", "m4", "m5"], "intro": "You are the operations manager for Skyline Air, a brand new airline. Use your math to plan fuel, cargo, schedules, routes, seats, and ticket prices for the first week of flights. Show your work on paper. Parts 1 to 15 are checked by the computer. Parts 16 and 17 are scored by your teacher."}, {"id": "term", "type": "term", "cat": "end", "title": "Term 1 Final Exam: Captain’s Check Ride", "sub": "Modules 1 to 5", "min": 90, "when": "End of Term 1", "mods": ["m1", "m2", "m3", "m4", "m5"], "code": "Q0hFQ0tSSURF"}];
const QS={"hw2": [{"t": "num", "q": "Write a fraction equivalent to 3/4 that has a denominator of 20. Type it as a fraction.", "a": "eyJhIjogIjE1LzIwIiwgImV4YWN0IjogdHJ1ZX0=", "mod": "m2", "hint": "Multiply the top and the bottom by the same number. What times 4 makes 20?", "fig": null, "work": null, "pts": 1, "id": "hw2-1"}, {"t": "num", "q": "Simplify 18/24.", "a": "eyJhIjogIjMvNCIsICJleGFjdCI6IGZhbHNlfQ==", "mod": "m2", "hint": "Divide the top and bottom by their greatest common factor.", "fig": null, "work": null, "pts": 1, "id": "hw2-2"}, {"t": "num", "q": "Simplify 28/42.", "a": "eyJhIjogIjIvMyIsICJleGFjdCI6IGZhbHNlfQ==", "mod": "m2", "hint": "Both numbers can be divided by 14.", "fig": null, "work": null, "pts": 1, "id": "hw2-3"}, {"t": "mc", "q": "Which fraction is equivalent to 5/8?", "a": "eyJhIjogIjE1LzI0In0=", "choices": ["15/24", "10/24", "15/32", "5/24"], "mod": "m2", "hint": "Multiply the top and bottom of 5/8 by the same number.", "fig": null, "work": null, "pts": 1, "id": "hw2-4"}, {"t": "num", "q": "Add: 2/5 + 1/3", "a": "eyJhIjogIjExLzE1IiwgImV4YWN0IjogZmFsc2V9", "mod": "m2", "hint": "Use a common denominator of 15.", "fig": null, "work": null, "pts": 1, "id": "hw2-5"}, {"t": "num", "q": "Subtract: 7/8 − 1/4", "a": "eyJhIjogIjUvOCIsICJleGFjdCI6IGZhbHNlfQ==", "mod": "m2", "hint": "Change 1/4 to eighths first.", "fig": null, "work": null, "pts": 1, "id": "hw2-6"}, {"t": "num", "q": "A pilot flew 3 1/2 hours on Monday and 2 3/4 hours on Tuesday. How many hours did she fly in all?", "a": "eyJhIjogIjYgMS80IiwgImV4YWN0IjogZmFsc2V9", "mod": "m2", "hint": "Add the fractions first. Then add the whole numbers and regroup if needed.", "fig": null, "work": null, "pts": 1, "id": "hw2-7"}, {"t": "num", "q": "A fuel tank held 8 1/3 gallons. After a short flight, 3 5/6 gallons were left. How many gallons were used?", "a": "eyJhIjogIjQgMS8yIiwgImV4YWN0IjogZmFsc2V9", "mod": "m2", "hint": "Use a common denominator of 6. You may need to regroup one whole.", "fig": nu ull, "work": "nl:-60:20", "pts": 1, "id": "proj-7"}, {"t": "num", "q": "Part 8, Speed of Route A. Route A flies 1,350 miles in 3 hours. How many miles per hour is that?", "a": "eyJhIjogIjQ1MCIsICJleGFjdCI6IGZhbHNlfQ==", "mod": "m4", "hint": null, "fig": null, "work": null, "pts": 1, "id": "proj-8"}, {"t": "mc", "q": "Part 9, Which Route is Faster? Route B flies 1,680 miles in 4 hours. Compare it to Route A from Part 8. Which route has the greater speed?", "a": "eyJhIjogIlJvdXRlIEEifQ==", "choices": ["Route A", "Route B", "They are the same speed"], "mod": "m4", "hint": null, "fig": null, "work": null, "pts": 1, "id": "proj-9"}, {"t": "ratio", "q": "Part 10, Seats. Skyline Air's plane has 30 business seats and 150 economy seats. Write the ratio of business seats to economy seats in simplest form (like 3:5).", "a": "eyJhIjogIjE6NSJ9", "mod": "m4", "hint": null, "fig": null, "work": null, "pts": 1, "id": "proj-10"}, {"t": "num", "q": "Part 11, Fuel Rate. A jet burns 810 gallons of fuel in 1 hour. How many gallons does it burn in 1 minute? (There are 60 minutes in 1 hour.)", "a": "eyJhIjogIjEzLjUiLCAiZXhhY3QiOiBmYWxzZX0=", "mod": "m4", "hint": null, "fig": null, "work": null, "pts": 1, "id": "proj-11"}, {"t": "num", "q": "Part 12, Full Flights. A plane has 240 seats and the flight is 85% full. How many seats are filled?", "a": "eyJhIjogIjIwNCIsICJleGFjdCI6IGZhbHNlfQ==", "mod": "m5", "hint": null, "fig": null, "work": null, "pts": 1, "id": "proj-12"}, {"t": "num", "q": "Part 13, Ticket Sale. A $380 ticket goes on sale for 15% off. What is the sale price in dollars?", "a": "eyJhIjogIjMyMyIsICJleGFjdCI6IGZhbHNlfQ==", "mod": "m5", "hint": null, "fig": null, "work": null, "pts": 1, "id": "proj-13"}, {"t": "num", "q": "Part 14, On-Time Record. 36 out of 40 Skyline Air flights were on time. What percent were on time?", "a": "eyJhIjogIjkwIiwgImV4YWN0IjogZmFsc2V9", "mod": "m5", "hint": null, "fig": null, "work": null, "pts": 1, "id": "proj-14"}, {"t": "num", "q": "Part 15, Passenger Count. On one flight, 63 passengers are in the main cabin. That is 70% of all passengers. How many passengers are on the flight?", "a": "eyJhIjogIjkwIiwgImV4YWN0IjogZmFsc2V9", "mod": "m5", "hint": null, "fig": null, "work": null, "pts": 1, "id": "proj-15"}, {"t": "text", "q": "Part 16, Recommend a Route. Use your answers from Parts 8 and 9. Explain how you found the speed of each route, and tell which route you would recommend and why. Write 3 to 4 sentences.", "a": "eyJydWJyaWMiOiAiNCBwdHM6IHNwZWVkcyBmb3VuZCB3aXRoIGRpdmlzaW9uOyBjb3JyZWN0IGNvbXBhcmlzb247IHJlYXNvbmluZyB1c2VzIHVuaXQgcmF0ZXM7IGNsZWFyIHNlbnRlbmNlcy4ifQ==", "mod": "m4", "hint": null, "fig": null, "work": null, "pts": 0, "lines": 6, "id": "proj-16"}, {"t": "text", "q": "Part 17, Report to the Boss. Choose three results from this project (for example fuel cost, seats, or on-time percent). For each one, write one sentence that explains what the number means for running the airline.", "a": "eyJydWJyaWMiOiAiNCBwdHM6IHRocmVlIHJlc3VsdHMgY2hvc2VuOyBlYWNoIGV4cGxhaW5lZCBpbiBjb250ZXh0OyBtYXRoIHZvY2FidWxhcnkgdXNlZDsgY2xlYXIgd3JpdGluZy4ifQ==", "mod": "m5", "hint": null, "fig": null, "work": null, "pts": 0, "lines": 7, "id": "proj-17"}]};
const MANUAL={"m1": {"title": "Module 1: Whole Numbers and Decimals", "f": ["Decimal places: tenths = 0.1, hundredths = 0.01, thousandths = 0.001", "To compare decimals, line up the decimal points and add zeros: 0.5 = 0.50 = 0.500", "Add or subtract decimals: line up the decimal points first", "Multiply decimals: multiply as whole numbers, then give the answer as many decimal places as both factors have together", "Divide by a decimal: move the decimal point in the divisor to make a whole number, then move the dividend's decimal point the same number of places", "GCF (greatest common factor): the biggest number that divides both numbers", "LCM (least common multiple): the smallest number that both numbers divide into"], "s": ["Name the place of each digit before you compare numbers.", "Add zeros so every decimal has the same number of places, then compare digit by digit from the left.", "For multiplying: ignore the decimal points, multiply, then count the decimal places and place the point.", "For dividing by a decimal: shift both decimal points the same number of places to the right, then divide as usual.", "For GCF: list the factors of both numbers and circle the biggest match. For LCM: list multiples of both numbers until you find the first match.", "Check by estimating. Does your answer make sense?"]}, "m2": {"title": "Module 2: Fractions", "f": ["Equivalent fractions: multiply or divide the top and bottom by the same number", "Simplify: divide the top and bottom by their GCF", "Add or subtract: use a common denominator, then add or subtract the tops", "Multiply: (a/b) × (c/d) = (a × c) / (b × d)", "Divide: (a/b) ÷ (c/d) = (a/b) × (d/c)   (keep, change, flip)", "Mixed number to fraction: (whole × denominator + numerator) / denominator"], "s": ["For adding or subtracting, find a common denominator first. Regroup one whole if you need to subtract from a smaller fraction.", "For multiplying or dividing mixed numbers, change them to improper fractions first.", "For dividing, ask: how many of the second fraction fit into the first?", "Simplify your answer and change improper fractions to mixed numbers when asked.", "Check: multiplying by a fraction less than 1 makes the answer smaller. Dividing by a fraction less than 1 makes it larger."]}, "m3": {"title": "Module 3: Rational Numbers", "f": ["Positive numbers are to the right of 0. Negative numbers are to the left of 0.", "Opposites are the same distance from 0 on opposite sides: the opposite of -4 is 4", "Absolute value = distance from 0, so it is never negative: |-7| = 7", "The number farther to the right on a number line is greater", "Below sea level, below zero, a loss, or going down is negative"], "s": ["Picture or draw a number line. Mark 0 first.", "To compare or order, change fractions and decimals to the same form (usually decimals).", "Negative numbers get smaller as the number part gets bigger: -8 is less than -2.", "Read word problems for clue words: below, loss, down, owe (negative) or above, gain, up (positive)."]}, "m4": {"title": "Module 4: Ratios and Rates", "f": ["Ratio notation: a to b, a:b, or a/b. Order matters.", "Equivalent ratios: multiply or divide both parts by the same number", "Unit rate = amount ÷ number of units (for example miles per hour = miles ÷ hours)", "Unit price = total cost ÷ number of items", "Better buy: the lower unit price", "Convert units with a ratio: multiply by (new units per 1 old unit)"], "s": ["Write the ratio in the order the problem names the items.", "Simplify by dividing both numbers by their GCF.", "For a tape diagram: count all the boxes, divide the total by that count to find what one box is worth, then multiply.", "For a double number line or ratio table: find the unit rate (the amount for 1), then multiply.", "For better buy problems: find the unit price of each choice and compare."]}, "m5": {"title": "Module 5: Percentages", "f": ["Percent means per 100: 45% = 45/100 = 0.45", "Fraction to percent: divide the top by the bottom, then multiply by 100", "Percent of a quantity: part = percent × whole (use the decimal form)", "Find the whole: whole = part ÷ percent (use the decimal form)", "Find the percent: percent = part ÷ whole × 100", "Sale price = original price − discount"], "s": ["Change the percent to a decimal by moving the decimal point 2 places to the left.", "To find a percent of a number, multiply. To find the whole when you know the part, divide.", "For discounts, find the discount first, then subtract it from the original price.", "Check: 50% is half, 25% is a quarter, 10% is one tenth. Use these to see if your answer is reasonable."]}};
const LESSONS=[{"id": "l1", "mod": "m1", "title": "Place Value: Reading, Comparing and Ordering", "idea": "Every digit has a place, and each place is worth 10 times the place to its right. Decimal places go on past the decimal point: tenths, hundredths, thousandths.", "points": ["Say the place of each digit: ones, tenths, hundredths, thousandths.", "To compare decimals, line up the decimal points and add zeros so each number has the same number of places.", "Compare digits from the left. The first place where they differ decides which number is greater."], "ex_q": "Order 5.62, 5.6, 5.062, and 5.26 from least to greatest.", "ex_steps": ["Add zeros so every number has three decimal places.", "Compare the ones, then the tenths, then the hundredths, then the thousandths.", "Write the numbers in order and say how you know."], "qs": [{"id": "l1-1", "q": "A cargo plane’s weight display reads 52,408.371 pounds. Which digit is in the hundredths place?", "a": "7", "choices": ["7", "3", "8", "1"], "how": "Hundredths is the second place after the decimal point. In .371, the 3 is tenths, the 7 is hundredths, and the 1 is thousandths.", "fig": null, "work": null, "mod": "m1"}, {"id": "l1-2", "q": "What is the value of the digit 5 in 9,051.246?", "a": "50", "choices": ["50", "5", "500", "0.5"], "how": "Name the place first. 9,051 has 9 thousands, 0 hundreds, 5 tens, and 1 one. Five tens is worth 50.", "fig": null, "work": null, "mod": "m1"}, {"id": "l1-3", "q": "Which list shows these altitudes in order from least to greatest: 14.08 km, 14.8 km, 14.008 km, 14.18 km?", "a": "14.008, 14.08, 14.18, 14.8", "choices": ["14.008, 14.08, 14.18, 14.8", "14.8, 14.18, 14.08, 14.008", "14.008, 14.8, 14.08, 14.18", "14.08, 14.008, 14.18, 14.8"], "how": "Add zeros: 14.080, 14.800, 14.008, 14.180. Compare the tenths first, then the hundredths, then the thousandths.", "fig": null, "work": null, "mod": "m1"}, {"id": "l1-4", "q": "Which symbol makes this true? 6.305 ___ 6.35", "a": "<", "choices": ["<", ">", "=", "Cannot tell"], "how": "Write 6.35 as 6.350. The ones and tenths match (6.3). The hundredths are 0 and 5, and 0 is less than 5.", "fig": null, "work": null, "mod": "m1"}, {"id": "l1-5", "q": "Which number is “two hundred four and seven hundredths”?", "a": "204.07", "choices": ["204.07", "204.7", "240.07", "204.007"], "how": "“And” marks the decimal point. Seven hundredths needs two decimal places, so write 07 after the point.", "fig": null, "work": null, "mod": "m1"}]}, {"id": "l2", "mod": "m1", "title": "Adding and Subtracting Decimals", "idea": "Adding and subtracting decimals works like whole numbers as long as the decimal points are lined up. Place values must match.", "points": ["Line up the decimal points first.", "Add zeros as placeholders so every number has the same number of decimal places.", "Work from right to left, regroup when you need to, and bring the decimal point straight down."], "ex_q": "Find 47.3 + 8.96.", "ex_steps": ["Rewrite 47.3 as 47.30 so the decimal points line up.", "Add the hundredths, then the tenths, then the ones and tens. Regroup as needed.", "Bring the decimal point straight down into the answer."], "qs": [{"id": "l2-1", "q": "A pilot logs 12.6 hours in May and 8.75 hours in June. How many hours is that in all?", "a": "21.35", "choices": ["21.35", "20.35", "22.35", "10.01"], "how": "Write 12.60 so the decimal points line up: 12.60 + 8.75. The hundredths and tenths add to 35, then 12 + 8 = 20 plus the regrouped 1 makes 21.", "fig": null, "work": null, "mod": "m1"}, {"id": "l2-2", "q": "A repair crew has 45 gallons of paint and uses 18.35 gallons. How many gallons are left?", "a": "26.65", "choices": ["26.65", "27.65", "27.35", "63.35"], "how": "Write 45 as 45.00. Subtract 45.00 − 18.35, regrouping across the decimal point. Check by adding 26.65 + 18.35 = 45.", "fig": null, "work": null, "mod": "m1"}, {"id": "l2-3", "q": "Find 306.4 + 59.78.", "a": "366.18", "choices": ["366.18", "365.18", "366.28", "36.618"], "how": "Write 306.40 so the places match. 306.40 + 59.78 = 366.18.", "fig": null, "work": null, "mod": "m1"}, {"id": "l2-4", "q": "A tank holds 120.5 gallons. A plane takes 78.64 gallons. How many gallons remain?", "a": "41.86", "choices": ["41.86", "42.14", "41.14", "199.14"], "how": "Write 120.50 − 78.64. Regroup from the tenths and ones. Check: 41.86 + 78.64 = 120.50.", "fig": null, "work": null, "mod": "m1"}, {"id": "l2-5", "q": "A baggage handler loads bags that weigh 14.25 kg, 9.8 kg, and 22.05 kg. What is the total weight?", "a": "46.1", "choices": ["46.1", "45.1", "47.1", "46.01"], "how": "Write 9.8 as 9.80. Add the hundredths, tenths, ones, and tens: 14.25 + 9.80 + 22.05 = 46.10, which is 46.1.", "fig": null, "work": null, "mod": "m1"}]}, {"id": "l3", "mod": "m1", "title": "Multiplying Decimals", "idea": "Multiply decimals like whole numbers first. Then use the decimal places in the factors to place the decimal point in the product.", "points": ["Ignore the decimal points and multiply the numbers as whole numbers.", "Count the total decimal places in both factors.", "Put that many decimal places in the product. Then check the size with an estimate."], "ex_q": "Find 3.4 × 0.25.", "ex_steps": ["Multiply 34 × 25 as whole numbers.", "Count the decimal places: 3.4 has 1 and 0.25 has 2.", "Place the decimal point so the product has that many decimal places, then estimate to check."], "qs": [{"id": "l3-1", "q": "A jet burns 3.6 gallons of fuel each minute. How many gallons does it burn in 25 minutes?", "a": "90", "choices": ["90", "9", "900", "28.6"], "how": "Multiply 36 × 25 = 900. There is 1 decimal place in all, so 900 becomes 90.0. Estimate: 4 × 25 = 100, so 90 makes sense.", "fig": null, "work": null, "mod": "m1"}, {"id": "l3-2", "q": "Find 4.7 × 0.6.", "a": "2.82", "choices": ["2.82", "28.2", "0.282", "5.3"], "how": "47 × 6 = 282. There are 2 decimal places in all (1 + 1), so the answer is 2.82. Estimate: 5 × 0.6 = 3.", "fig": null, "work": null, "mod": "m1"}, {"id": "l3-3", "q": "A runway light uses 0.35 kilowatt each hour. How many kilowatts does it use in 18 hours?", "a": "6.3", "choices": ["6.3", "63", "0.63", "18.35"], "how": "35 × 18 = 630. There are 2 decimal places, so 630 becomes 6.30, which is 6.3. Estimate: 0.4 × 18 is about 7.", "fig": null, "work": null, "mod": "m1"}, {"id": "l3-4", "q": "Fuel costs $5.20 per gallon. How much do 7.5 gallons cost?", "a": "$39", "choices": ["$39", "$3.90", "$390", "$12.70"], "how": "520 × 75 = 39,000. There are 3 decimal places in all, so the answer is $39.000, which is $39. Estimate: 5 × 8 = 40.", "fig": null, "work": null, "mod": "m1"}, {"id": "l3-5", "q": "Find 2.35 × 1.4.", "a": "3.29", "choices": ["3.29", "32.9", "0.329", "3.75"], "how": "235 × 14 = 3,290. There are 3 decimal places in all, so the answer is 3.290, which is 3.29.", "fig": null, "work": null, "mod": "m1"}]}, {"id": "l4", "mod": "m1", "title": "Dividing Whole Numbers and Decimals", "idea": "Division finds equal groups. When you divide by a decimal, move the decimal point in the divisor and the dividend the same number of places so you divide by a whole number.", "points": ["Estimate first so you know about how big the answer should be.", "Dividing by a decimal: move the decimal point in the divisor to the right until it is a whole number. Move the dividend’s decimal point the same number of places.", "Place the decimal point in the answer directly above the decimal point in the dividend."], "ex_q": "Find 7.56 ÷ 0.6.", "ex_steps": ["Move the decimal point one place right in both numbers: 75.6 ÷ 6.", "Divide as usual and bring the decimal point straight up.", "Check by multiplying the answer by 0.6."], "qs": [{"id": "l4-1", "q": "A hangar floor of 2,184 square feet is split into 12 equal parking zones. How many square feet is each zone?", "a": "182", "choices": ["182", "18.2", "1,820", "192"], "how": "2,184 ÷ 12 = 182. Check: 182 × 12 = 2,184. Estimate: 2,400 ÷ 12 = 200.", "fig": null, "work": null, "mod": "m1"}, {"id": "l4-2", "q": "Find 94.5 ÷ 7.", "a": "13.5", "choices": ["13.5", "135", "1.35", "12.5"], "how": "7 goes into 94 thirteen times with 3 left over. Bring down the 5 to get 35, and 7 goes into 35 five times. Put the decimal point to get 13.5.", "fig": null, "work": null, "mod": "m1"}, {"id": "l4-3", "q": "A plane flies 612.5 miles in 3.5 hours. What is its speed in miles per hour?", "a": "175", "choices": ["175", "17.5", "1,750", "215"], "how": "Move both decimal points one place: 6,125 ÷ 35 = 175. Check: 175 × 3.5 = 612.5.", "fig": null, "work": null, "mod": "m1"}, {"id": "l4-4", "q": "Find 8.4 ÷ 0.07.", "a": "120", "choices": ["120", "12", "1.2", "1,200"], "how": "Move both decimal points two places right: 840 ÷ 7 = 120. Check: 120 × 0.07 = 8.4.", "fig": null, "work": null, "mod": "m1"}, {"id": "l4-5", "q": "A fuel truck pours 36.75 gallons equally into 5 planes. How many gallons does each plane get?", "a": "7.35", "choices": ["7.35", "73.5", "0.735", "7.15"], "how": "36.75 ÷ 5 = 7.35. Keep the decimal point directly above the decimal point in the dividend. Check: 7.35 × 5 = 36.75.", "fig": null, "work": null, "mod": "m1"}]}, {"id": "l5", "mod": "m1", "title": "Factors, Multiples, GCF and LCM", "idea": "Factors multiply to make a number. Multiples are what you get when you count by a number. The GCF is the biggest shared factor and the LCM is the smallest shared multiple.", "points": ["Factors come in pairs. Start with 1 and the number itself.", "GCF: list the factors of both numbers and pick the greatest one they share.", "LCM: list multiples of both numbers until you find the first match."], "ex_q": "Find the GCF and the LCM of 8 and 20.", "ex_steps": ["List the factors of 8 and the factors of 20. Circle the greatest shared factor.", "List multiples of 8 and multiples of 20 until a number appears on both lists.", "Say which answer is for GCF and which is for LCM, and why."], "qs": [{"id": "l5-1", "q": "Which list shows all of the factors of 28?", "a": "1, 2, 4, 7, 14, 28", "choices": ["1, 2, 4, 7, 14, 28", "1, 2, 4, 14, 28", "1, 2, 4, 7, 14", "2, 4, 7, 14"], "how": "Factor pairs of 28: 1 × 28, 2 × 14, 4 × 7. List all six numbers in order.", "fig": null, "work": null, "mod": "m1"}, {"id": "l5-2", "q": "What is the GCF of 32 and 48?", "a": "16", "choices": ["16", "8", "96", "4"], "how": "Factors of 32: 1, 2, 4, 8, 16, 32. Factors of 48 include 16, and 16 is the greatest factor they share.", "fig": null, "work": null, "mod": "m1"}, {"id": "l5-3", "q": "What is the LCM of 10 and 15?", "a": "30", "choices": ["30", "5", "150", "60"], "how": "Multiples of 10: 10, 20, 30. Multiples of 15: 15, 30. The first match is 30. (60 is a common multiple, but not the least.)", "fig": null, "work": null, "mod": "m1"}, {"id": "l5-4", "q": "Two flight crews rest every 15 days and every 20 days. Both rest today. In how many days will they rest on the same day again?", "a": "60", "choices": ["60", "5", "300", "30"], "how": "Find the LCM of 15 and 20. Multiples of 15: 15, 30, 45, 60. Multiples of 20: 20, 40, 60. The first match is 60.", "fig": null, "work": null, "mod": "m1"}, {"id": "l5-5", "q": "A tarmac crew has 30 orange flags and 45 white flags. They make identical bundles with none left over. What is the greatest number of bundles they can make?", "a": "15", "choices": ["15", "5", "90", "3"], "how": "Greatest number of identical bundles means the GCF of 30 and 45. The greatest shared factor is 15.", "fig": null, "work": null, "mod": "m1"}]}, {"id": "l6", "mod": "m2", "title": "Equivalent Fractions and Simplifying", "idea": "Equivalent fractions name the same amount. You make one by multiplying or dividing the top and bottom by the same number.", "points": ["Multiply or divide the numerator and the denominator by the same number.", "To simplify, divide the top and bottom by their GCF.", "A fraction is in simplest form when the top and bottom share no factor other than 1."], "ex_q": "Write 18/30 in simplest form.", "ex_steps": ["Find the GCF of 18 and 30.", "Divide the top and the bottom by the GCF.", "Check that the new top and bottom share no factor but 1."], "qs": [{"id": "l6-1", "q": "Which fraction is equivalent to 2/7?", "a": "8/28", "choices": ["8/28", "8/21", "6/28", "2/28"], "how": "2 × 4 = 8 and 7 × 4 = 28, so 2/7 = 8/28. Both parts must be multiplied by the same number.", "fig": null, "work": null, "mod": "m2"}, {"id": "l6-2", "q": "Simplify 24/36.", "a": "2/3", "choices": ["2/3", "12/18", "6/9", "4/6"], "how": "The GCF of 24 and 36 is 12. 24 ÷ 12 = 2 and 36 ÷ 12 = 3. The other choices are equivalent but not in simplest form.", "fig": null, "work": null, "mod": "m2"}, {"id": "l6-3", "q": "Which fraction shows 15/40 in simplest form?", "a": "3/8", "choices": ["3/8", "15/40", "5/8", "3/5"], "how": "The GCF of 15 and 40 is 5. 15 ÷ 5 = 3 and 40 ÷ 5 = 8.", "fig": null, "work": null, "mod": "m2"}, {"id": "l6-4", "q": "Which pair of fractions is equivalent?", "a": "6/10 and 9/15", "choices": ["6/10 and 9/15", "6/10 and 9/12", "4/6 and 6/8", "2/5 and 4/9"], "how": "Simplify each: 6/10 = 3/5 and 9/15 = 3/5. The fractions in the other pairs simplify to different amounts.", "fig": null, "work": null, "mod": "m2"}, {"id": "l6-5", "q": "Write 5/6 as an equivalent fraction with a denominator of 42.", "a": "35/42", "choices": ["35/42", "30/42", "11/42", "5/42"], "how": "6 × 7 = 42, so multiply the top by 7 too: 5 × 7 = 35.", "fig": null, "work": null, "mod": "m2"}]}, {"id": "l7", "mod": "m2", "title": "Adding and Subtracting Fractions and Mixed Numbers", "idea": "You can only add or subtract fractions with the same denominator. Rename the fractions with a common denominator, then work with the numerators.", "points": ["Find a common denominator (the LCM of the denominators works best).", "Add or subtract the numerators and keep the denominator.", "With mixed numbers, add or subtract the fractions first, regroup if needed, then do the whole numbers. Simplify at the end."], "ex_q": "Find 5/6 − 1/4.", "ex_steps": ["Find a common denominator for 6 and 4.", "Rewrite both fractions with that denominator.", "Subtract the numerators, keep the denominator, and simplify."], "qs": [{"id": "l7-1", "q": "Add: 1/4 + 2/3", "a": "11/12", "choices": ["11/12", "3/7", "3/12", "2/12"], "how": "Common denominator 12: 1/4 = 3/12 and 2/3 = 8/12. Add the numerators: 3 + 8 = 11, so 11/12.", "fig": null, "work": null, "mod": "m2"}, {"id": "l7-2", "q": "Subtract: 7/8 − 1/3", "a": "13/24", "choices": ["13/24", "6/5", "6/24", "14/24"], "how": "Common denominator 24: 7/8 = 21/24 and 1/3 = 8/24. Subtract: 21 − 8 = 13, so 13/24.", "fig": null, "work": null, "mod": "m2"}, {"id": "l7-3", "q": "Add: 2 2/3 + 1 5/6", "a": "4 1/2", "choices": ["4 1/2", "3 7/9", "3 1/2", "4 3/4"], "how": "2 2/3 = 2 4/6. Add the fractions: 4/6 + 5/6 = 9/6 = 1 3/6 = 1 1/2. Add the wholes: 2 + 1 + 1 = 4. The answer is 4 1/2.", "fig": null, "work": null, "mod": "m2"}, {"id": "l7-4", "q": "Subtract: 7 1/5 − 2 7/10", "a": "4 1/2", "choices": ["4 1/2", "5 1/2", "4 9/10", "4 1/10"], "how": "Rename 1/5 as 2/10. You cannot take 7/10 from 2/10, so regroup: 7 2/10 = 6 12/10. Then 6 12/10 − 2 7/10 = 4 5/10 = 4 1/2.", "fig": null, "work": null, "mod": "m2"}, {"id": "l7-5", "q": "A mechanic uses 1/3 quart of oil, then 1/4 quart, then 1/6 quart. How many quarts in all?", "a": "3/4", "choices": ["3/4", "9/12", "3/13", "1/2"], "how": "Common denominator 12: 4/12 + 3/12 + 2/12 = 9/12. Simplify by dividing by 3 to get 3/4.", "fig": null, "work": null, "mod": "m2"}]}, {"id": "l8", "mod": "m2", "title": "Multiplying Fractions and Mixed Numbers", "idea": "To multiply fractions, multiply the numerators and multiply the denominators. Multiplying by a fraction finds a part of an amount.", "points": ["Fraction × fraction: top × top and bottom × bottom.", "Change mixed numbers to improper fractions before you multiply.", "Simplify, either before you multiply or at the end."], "ex_q": "Find 1 1/3 × 2 1/4.", "ex_steps": ["Change both mixed numbers to improper fractions.", "Multiply the numerators and the denominators.", "Simplify and change to a mixed number if needed."], "qs": [{"id": "l8-1", "q": "Multiply: 3/5 × 2/9", "a": "2/15", "choices": ["2/15", "6/45", "5/14", "3/10"], "how": "3 × 2 = 6 and 5 × 9 = 45, which is 6/45. Simplify by dividing both by 3 to get 2/15.", "fig": null, "work": null, "mod": "m2"}, {"id": "l8-2", "q": "A plane has a tank that is 7/10 full. A pilot uses 5/6 of that fuel. What fraction of the whole tank was used?", "a": "7/12", "choices": ["7/12", "35/60", "12/16", "7/16"], "how": "Multiply 7/10 × 5/6 = 35/60. Simplify by dividing both by 5 to get 7/12.", "fig": null, "work": null, "mod": "m2"}, {"id": "l8-3", "q": "Multiply: 2 1/2 × 1 4/5", "a": "4 1/2", "choices": ["4 1/2", "2 2/5", "3 3/10", "9/5"], "how": "2 1/2 = 5/2 and 1 4/5 = 9/5. Multiply: 5/2 × 9/5 = 45/10 = 4 5/10 = 4 1/2.", "fig": null, "work": null, "mod": "m2"}, {"id": "l8-4", "q": "A hangar is 12 3/4 yards wide. A tent covers 2/3 of the width. How many yards wide is the tent?", "a": "8 1/2", "choices": ["8 1/2", "9 1/2", "8 1/4", "25 1/2"], "how": "12 3/4 = 51/4. Multiply 51/4 × 2/3 = 102/12 = 8 6/12 = 8 1/2.", "fig": null, "work": null, "mod": "m2"}, {"id": "l8-5", "q": "A jet burns 4 1/2 gallons each minute. How many gallons does it burn in 3 1/3 minutes?", "a": "15", "choices": ["15", "12 1/6", "7 5/6", "16 1/2"], "how": "4 1/2 = 9/2 and 3 1/3 = 10/3. Multiply: 9/2 × 10/3 = 90/6 = 15.", "fig": null, "work": null, "mod": "m2"}]}, {"id": "l9", "mod": "m2", "title": "Dividing Fractions: Visual Models and Reasoning", "idea": "Dividing asks how many groups fit. Draw a model to see how many pieces of one size fit into an amount.", "points": ["Dividing by a fraction asks: how many of this piece fit?", "Draw a bar or number line and split it into the size of the piece.", "The pattern: dividing by a fraction is the same as multiplying by its reciprocal (flip it)."], "ex_q": "How many 1/3-cup scoops are in 2 cups?", "ex_steps": ["Draw 2 bars to show 2 cups.", "Cut each bar into thirds and count all the pieces.", "Write the division equation and the multiplication equation that match your model."], "qs": [{"id": "l9-1", "q": "How many 1/4-cup scoops are in 3 cups?", "a": "12", "choices": ["12", "3/4", "7", "3"], "how": "Each cup holds 4 scoops of 1/4 cup. 3 cups hold 3 × 4 = 12 scoops. That matches 3 ÷ 1/4 = 3 × 4.", "fig": null, "work": null, "mod": "m2"}, {"id": "l9-2", "q": "A bar model shows 2/3 of a bar cut into pieces that are each 1/9 of the whole bar. How many pieces are there?", "a": "6", "choices": ["6", "2/27", "18", "3"], "how": "2/3 = 6/9, so there are 6 pieces of size 1/9. That matches 2/3 ÷ 1/9 = 2/3 × 9 = 6.", "fig": null, "work": null, "mod": "m2"}, {"id": "l9-3", "q": "Which equation matches “How many 2/3-pound bags can be made from 4 pounds of cargo?”", "a": "4 ÷ 2/3", "choices": ["4 ÷ 2/3", "2/3 ÷ 4", "4 × 2/3", "4 − 2/3"], "how": "You are splitting 4 pounds into groups of 2/3 pound, so divide 4 by 2/3.", "fig": null, "work": null, "mod": "m2"}, {"id": "l9-4", "q": "Find 1/2 ÷ 1/8.", "a": "4", "choices": ["4", "1/16", "16", "1/4"], "how": "How many eighths fit in one half? 1/2 = 4/8, so 4 pieces fit.", "fig": null, "work": null, "mod": "m2"}, {"id": "l9-5", "q": "Find 2/3 ÷ 4.", "a": "1/6", "choices": ["1/6", "8/3", "6", "1/3"], "how": "Split 2/3 into 4 equal parts. 2/3 ÷ 4 = 2/3 × 1/4 = 2/12 = 1/6.", "fig": null, "work": null, "mod": "m2"}]}, {"id": "l10", "mod": "m2", "title": "Dividing Fractions and Mixed Numbers in Word Problems", "idea": "In word problems, decide what the groups are, then divide. Change mixed numbers to improper fractions, then multiply by the reciprocal.", "points": ["Ask: what is the total and what is the size of each group?", "Change mixed numbers to improper fractions.", "Keep, change, flip: keep the first fraction, change division to multiplication, flip the second fraction."], "ex_q": "A banner 5 1/4 feet long is cut into pieces that are 3/4 foot long. How many pieces?", "ex_steps": ["Write the division equation using improper fractions.", "Keep, change, flip, then multiply.", "Simplify and check that the answer makes sense."], "qs": [{"id": "l10-1", "q": "A cargo hold has 6 1/2 tons of mail. Each mail bag holds 1/4 ton. How many bags are needed?", "a": "26", "choices": ["26", "1 5/8", "6 3/4", "24"], "how": "6 1/2 = 13/2. Divide: 13/2 ÷ 1/4 = 13/2 × 4 = 52/2 = 26.", "fig": null, "work": null, "mod": "m2"}, {"id": "l10-2", "q": "A plane flies 4 1/2 miles in 3/4 of a minute. How many miles per minute is that?", "a": "6", "choices": ["6", "3 3/8", "5 1/4", "7 1/2"], "how": "4 1/2 = 9/2. Divide: 9/2 ÷ 3/4 = 9/2 × 4/3 = 36/6 = 6.", "fig": null, "work": null, "mod": "m2"}, {"id": "l10-3", "q": "Divide: 2 2/5 ÷ 3/10", "a": "8", "choices": ["8", "18/25", "7 1/5", "2 1/10"], "how": "2 2/5 = 12/5. Then 12/5 ÷ 3/10 = 12/5 × 10/3 = 120/15 = 8.", "fig": null, "work": null, "mod": "m2"}, {"id": "l10-4", "q": "A banner 9 3/4 feet long is cut into pieces that are 1 5/8 feet long. How many pieces are there?", "a": "6", "choices": ["6", "8 1/8", "6 1/2", "15 7/8"], "how": "9 3/4 = 39/4 and 1 5/8 = 13/8. Divide: 39/4 × 8/13 = 312/52 = 6.", "fig": null, "work": null, "mod": "m2"}, {"id": "l10-5", "q": "A test engine uses 2 1/4 gallons of fuel each mile. How many miles can it go on 13 1/2 gallons?", "a": "6", "choices": ["6", "5 1/4", "30 3/8", "11 1/4"], "how": "13 1/2 = 27/2 and 2 1/4 = 9/4. Divide: 27/2 × 4/9 = 108/18 = 6.", "fig": null, "work": null, "mod": "m2"}]}, {"id": "l11", "mod": "m3", "title": "Integers and Opposites in Context", "idea": "Integers include positive numbers, negative numbers, and zero. Opposites are the same distance from zero on opposite sides.", "points": ["Positive: above, gain, up, climb. Negative: below, loss, down, descend.", "The opposite of a number has the same distance from 0 but the other sign.", "Zero is its own opposite."], "ex_q": "Write an integer for each: a plane climbs 300 feet, and a plane descends 120 feet.", "ex_steps": ["Decide whether each situation is a gain or a loss.", "Write a positive integer for the gain and a negative integer for the loss.", "Name the opposite of each integer and explain what it would mean."], "qs": [{"id": "l11-1", "q": "A plane descends 800 feet. Which integer shows this change in altitude?", "a": "-800", "choices": ["-800", "800", "0", "-8"], "how": "Descending means going down, which is a negative change. The integer is -800.", "fig": null, "work": "nl:-1000:1000", "mod": "m3"}, {"id": "l11-2", "q": "What is the opposite of 15?", "a": "-15", "choices": ["-15", "15", "1/15", "0"], "how": "Opposites are the same distance from 0 on opposite sides of the number line.", "fig": null, "work": "nl:-20:20", "mod": "m3"}, {"id": "l11-3", "q": "Which situation matches the integer +40?", "a": "A plane gains 40 miles per hour of speed", "choices": ["A plane gains 40 miles per hour of speed", "A plane loses 40 miles per hour of speed", "An airport that is 40 feet below sea level", "A fuel tank that is 40 gallons short"], "how": "A positive integer shows a gain or a position above zero. Gaining speed is positive.", "fig": null, "work": null, "mod": "m3"}, {"id": "l11-4", "q": "The temperature at takeoff is 6 degrees Celsius. During the climb it drops 20 degrees. What is the temperature at altitude?", "a": "-14", "choices": ["-14", "14", "-26", "26"], "how": "Start at 6 on the number line and move 20 down: 6 − 20 = -14.", "fig": null, "work": "nl:-20:10", "mod": "m3"}, {"id": "l11-5", "q": "What is the opposite of the opposite of -9?", "a": "-9", "choices": ["-9", "9", "0", "-18"], "how": "The opposite of -9 is 9. The opposite of 9 is -9, so you are back where you started.", "fig": null, "work": "nl:-10:10", "mod": "m3"}]}, {"id": "l12", "mod": "m3", "title": "Absolute Value; Comparing and Ordering Rational Numbers", "idea": "Absolute value is the distance from zero, so it is never negative. On a number line, numbers farther to the right are greater.", "points": ["Absolute value |n| is the distance from 0.", "Compare using a number line: right is greater, left is less.", "To order fractions and decimals, change them all to decimals first."], "ex_q": "Compare -4.5 and -4.05, and find |-4.5|.", "ex_steps": ["Draw a number line from -5 to -4 and mark both numbers.", "Decide which one is farther right.", "Find the distance of -4.5 from 0 for the absolute value."], "qs": [{"id": "l12-1", "q": "What is |-14|?", "a": "14", "choices": ["14", "-14", "0", "28"], "how": "Absolute value is the distance from 0. -14 is 14 units from 0, and distance is never negative.", "fig": null, "work": "nl:-15:15", "mod": "m3"}, {"id": "l12-2", "q": "Which temperature is colder: -8 degrees or -3 degrees?", "a": "-8", "choices": ["-8", "-3", "They are the same", "0"], "how": "On the number line, -8 is farther left than -3, so it is less. Less means colder.", "fig": null, "work": "nl:-10:0", "mod": "m3"}, {"id": "l12-3", "q": "Which list is in order from least to greatest?", "a": "-9, -4, 0, 5", "choices": ["-9, -4, 0, 5", "5, 0, -4, -9", "-4, -9, 0, 5", "0, 5, -4, -9"], "how": "Order from left to right on the number line: -9, then -4, then 0, then 5.", "fig": null, "work": "nl:-10:10", "mod": "m3"}, {"id": "l12-4", "q": "Which statement is true?", "a": "-1.5 < -1.25", "choices": ["-1.5 < -1.25", "-1.5 > -1.25", "-3/4 < -1", "0.5 < -0.5"], "how": "-1.5 is farther left than -1.25, so it is less. Check the others: -3/4 is greater than -1, and 0.5 is greater than -0.5.", "fig": null, "work": "nl:-2:2", "mod": "m3"}, {"id": "l12-5", "q": "Airport A is 30 feet below sea level. Airport B is 75 feet below sea level. How many feet lower is Airport B?", "a": "45", "choices": ["45", "105", "-45", "75"], "how": "Find the distance between -30 and -75. The absolute values are 30 and 75, and 75 − 30 = 45.", "fig": null, "work": "nl:-80:0", "mod": "m3"}]}, {"id": "l13", "mod": "m3", "title": "Rational Numbers on the Number Line", "idea": "A rational number is any number that can be written as a fraction. Fractions and decimals, positive and negative, all have a spot on the number line.", "points": ["Count the equal spaces between whole numbers to find what each tick mark is worth.", "Fractions and decimals between two integers sit between them on the line.", "Opposites are the same distance from 0 on opposite sides."], "ex_q": "Plot -2 1/2 on a number line.", "ex_steps": ["Draw a number line from -4 to 0.", "Find -2 and -3, then find the point halfway between them.", "Mark the point and label it."], "qs": [{"id": "l13-1", "q": "Look at the number line. Which point shows -1.5?", "a": "Point B", "choices": ["Point B", "Point A", "Point C", "Point D"], "how": "-1.5 is halfway between -2 and -1. Point B is halfway between those marks.", "fig": "<svg viewBox=\"0 0 700 130\" role=\"img\" aria-label=\"Number line from -4 to 4\" style=\"color:inherit\"><line x1=\"20\" y1=\"70\" x2=\"680\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M20 70 l10 -7 v14z M680 70 l-10 -7 v14z\" fill=\"currentColor\"/><line x1=\"34.0\" y1=\"58\" x2=\"34.0\" y2=\"82\" stroke=\"currentColor\" stroke-width=\"2.5\"/><text x=\"34.0\" y=\"106\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"currentColor\">-4</text><line x1=\"113.0\" y1=\"58\" x2=\"113.0\" y2=\"82\" stroke=\"currentColor\" stroke-width=\"2.5\"/><text x=\"113.0\" y=\"106\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"currentColor\">-3</text><line x1=\"192.0\" y1=\"58\" x2=\"192.0\" y2=\"82\" stroke=\"currentColor\" stroke-width=\"2.5\"/><text x=\"192.0\" y=\"106\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"currentColor\">-2</text><line x1=\"271.0\" y1=\"58\" x2=\"271.0\" y2=\"82\" stroke=\"currentColor\" stroke-width=\"2.5\"/><text x=\"271.0\" y=\"106\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"currentColor\">-1</text><line x1=\"350.0\" y1=\"58\" x2= s the items.", "Find the GCF of both numbers.", "Divide both numbers by the GCF."], "qs": [{"id": "l14-1", "q": "A hangar has 12 jets and 20 propeller planes. Which is the ratio of jets to propeller planes in simplest form?", "a": "3:5", "choices": ["3:5", "5:3", "12:20", "3:8"], "how": "The GCF of 12 and 20 is 4. 12 ÷ 4 = 3 and 20 ÷ 4 = 5, so 3:5. Order matters: jets come first.", "fig": null, "work": null, "mod": "m4"}, {"id": "l14-2", "q": "The ratio of pilots to flight attendants is 2 to 3. Which sentence describes this ratio?", "a": "For every 2 pilots there are 3 flight attendants", "choices": ["For every 2 pilots there are 3 flight attendants", "For every 3 pilots there are 2 flight attendants", "There are 2 flight attendants in all", "There are 5 pilots in all"], "how": "The first number goes with the first item named, pilots. 2 pilots go with 3 flight attendants.", "fig": null, "work": null, "mod": "m4"}, {"id": "l14-3", "q": "A plane carries 18 adults and 6 children. What is the ratio of children to all passengers in simplest form?", "a": "1:4", "choices": ["1:4", "1:3", "3:4", "4:1"], "how": "There are 6 + 18 = 24 passengers in all. 6:24 simplifies by dividing by 6 to get 1:4.", "fig": null, "work": null, "mod": "m4"}, {"id": "l14-4", "q": "Which is another way to write the ratio 5 to 8?", "a": "5:8", "choices": ["5:8", "8:5", "13:8", "5:13"], "how": "A ratio can be written with the word to, a colon, or as a fraction. The order stays the same: 5 first, then 8.", "fig": null, "work": null, "mod": "m4"}, {"id": "l14-5", "q": "A plane has 28 window seats and 72 other seats. What is the ratio of window seats to all seats in simplest form?", "a": "7:25", "choices": ["7:25", "7:18", "28:72", "25:7"], "how": "There are 28 + 72 = 100 seats in all. 28:100 simplifies by dividing by 4 to get 7:25.", "fig": null, "work": null, "mod": "m4"}]}, {"id": "l15", "mod": "m4", "title": "Equivalent Ratios: Ratio Tables, Tape Diagrams and Double Number Lines", "idea": "Equivalent ratios compare amounts in the same relationship. Ratio tables, tape diagrams, and double number lines all show how to scale a ratio up or down.", "points": ["Multiply or divide both parts of a ratio by the same number to get an equivalent ratio.", "A tape diagram shows equal parts. Divide the total by the number of boxes to find what one box is worth.", "A double number line lines up two quantities that stay in the same ratio."], "ex_q": "Cleaning solution uses 3 cups of soap for every 4 gallons of water. How many cups of soap for 20 gallons of water?", "ex_steps": ["Make a ratio table with soap in one row and water in the other.", "Find what to multiply 4 by to get 20.", "Multiply the soap by the same number."], "qs": [{"id": "l15-1", "q": "The double number line shows a plane at a steady speed. How many miles does it fly in 12 minutes?", "a": "90", "choices": ["90", "72", "84", "96"], "how": "In 4 minutes it flies 30 miles, so in 12 minutes (3 times as long) it flies 3 × 30 = 90 miles.", "fig": "<svg viewBox=\"0 0 700 190\" role=\"img\" aria-label=\"Double number line\" style=\"color:inherit\"><line x1=\"110\" y1=\"50\" x2=\"670\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"3\"/><text x=\"0\" y=\"56\" font-size=\"19\" font-weight=\"800\" fill=\"currentColor\">Minutes</text><line x1=\"120.0\" y1=\"39\" x2=\"120.0\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"2.5\"/><text x=\"120.0\" y=\"32\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\" fill=\"currentColor\">0</text><line x1=\"300.0\" y1=\"39\" x2=\"300.0\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"2.5\"/><text x=\"300.0\" y=\"32\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\" fill=\"currentColor\">4</text><line x1=\"480.0\" y1=\"39\" x2=\"480.0\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"2.5\"/><text x=\"480.0\" y=\"32\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\" fill=\"currentColor\">8</text><line x1=\"660.0\" y1=\"39\" x2=\"660.0\" y2=\"61\ , "16", "45", "9"], "how": "There are 4 + 5 = 9 boxes. 36 ÷ 9 = 4 planes per box. Blue has 5 boxes: 5 × 4 = 20.", "fig": "<svg viewBox=\"0 0 420 176\" role=\"img\" aria-label=\"Tape diagram\" style=\"color:inherit\"><text x=\"0\" y=\"42.72\" font-size=\"20\" font-weight=\"800\" fill=\"currentColor\">Red</text><rect x=\"100\" y=\"8\" width=\"56\" height=\"56\" fill=\"#DD0426\" stroke=\"#fff\" stroke-width=\"3\" rx=\"4\"/><rect x=\"156\" y=\"8\" width=\"56\" height=\"56\" fill=\"#DD0426\" stroke=\"#fff\" stroke-width=\"3\" rx=\"4\"/><rect x=\"212\" y=\"8\" width=\"56\" height=\"56\" fill=\"#DD0426\" stroke=\"#fff\" stroke-width=\"3\" rx=\"4\"/><rect x=\"268\" y=\"8\" width=\"56\" height=\"56\" fill=\"#DD0426\" stroke=\"#fff\" stroke-width=\"3\" rx=\"4\"/><text x=\"0\" y=\"110.72\" font-size=\"20\" font-weight=\"800\" fill=\"currentColor\">Blue</text><rect x=\"100\" y=\"76\" width=\"56\" height=\"56\" fill=\"#1f6fd1\" stroke=\"#fff\" stroke-width=\"3\" rx=\"4\"/><rect x=\"156\" y=\"76\" width=\"56\" height=\"56\" fill=\"#1f6fd1\" stroke=\"#fff\" stroke-width=\"3\" rx=\"4\"/><rect x=\"212\" y=\"76\" width=\"56\" height=\"56\" fill=\"#1f6fd1\" stroke=\"#fff\" stroke-width=\"3\" rx=\"4\"/><rect x=\"268\" y=\"76\" width=\"56\" height=\"56\" fill=\"#1f6fd1\" stroke=\"#fff\" stroke-width=\"3\" rx=\"4\"/><rect x=\"324\" y=\"76\" width=\"56\" height=\"56\" fill=\"#1f6fd1\" stroke=\"#fff\" stroke-width=\"3\" rx=\"4\"/><text x=\"100\" y=\"166\" font-size=\"20\" font-weight=\"700\" fill=\"currentColor\">Total: 36 planes</text></svg>", "work": null, "mod": "m4"}, {"id": "l15-3", "q": "A pilot mixes cleaning solution with 2 cups of soap for every 5 gallons of water. How many cups of soap are needed for 20 gallons of water?", "a": "8", "choices": ["8", "10", "17", "6"], "how": "20 gallons is 4 times 5 gallons, so use 4 times as much soap: 2 × 4 = 8 cups.", "fig": null, "work": null, "mod": "m4"}, {"id": "l15-4", "q": "The ratio of fuel to oil is 15 to 2. Which ratio is equivalent?", "a": "45 to 6", "choices": ["45 to 6", "30 to 3", "45 to 4", "20 to 7"], "how": "Multiply both parts by 3: 15 × 3 = 45 and 2 × 3 = 6. Both parts must be multiplied by the same number.", "fig": null, "work": null, "mod": "m4"}, {"id": "l15-5", "q": "A plane flies 90 miles in 15 minutes. At the same speed, how many miles does it fly in 60 minutes?", "a": "360", "choices": ["360", "105", "270", "450"], "how": "60 minutes is 4 times 15 minutes, so the distance is 4 times as far: 90 × 4 = 360 miles.", "fig": null, "work": null, "mod": "m4"}]}, {"id": "l16", "mod": "m4", "title": "Unit Rates and Unit Pricing", "idea": "A unit rate tells how much for 1 unit. Unit price is the cost of 1 item. Both come from dividing.", "points": ["Unit rate = amount ÷ number of units (miles per hour = miles ÷ hours).", "Unit price = total cost ÷ number of items.", "The better buy is the lower unit price."], "ex_q": "A jet flies 975 miles in 3 hours. What is the unit rate in miles per hour?", "ex_steps": ["Decide which quantity goes on top and which goes on the bottom.", "Divide the first quantity by the second.", "Write the answer with its unit, miles per hour."], "qs": [{"id": "l16-1", "q": "A plane flies 1,425 miles in 3 hours. What is the unit rate in miles per hour?", "a": "475", "choices": ["475", "4,275", "47.5", "1,422"], "how": "Miles per hour means miles ÷ hours. 1,425 ÷ 3 = 475.", "fig": null, "work": null, "mod": "m4"}, {"id": "l16-2", "q": "A flight instructor charges $312 for 4 hours of lessons. What is the cost per hour?", "a": "$78", "choices": ["$78", "$1,248", "$8", "$308"], "how": "Cost per hour means dollars ÷ hours. 312 ÷ 4 = 78.", "fig": null, "work": null, "mod": "m4"}, {"id": "l16-3", "q": "A 6-pack of headset covers costs $13.50. What is the price of one headset cover?", "a": "$2.25", "choices": ["$2.25", "$81", "$7.50", "$0.44"], "how": "Unit price = total cost ÷ number of items. 13.50 ÷ 6 = 2.25.", "fig": null, "work": null, "mod": "m4"}, {"id": "l16-4", "q": "Which is the better buy?", "a": "6 bottles of water for $7.80", "choices": ["6 bottles of water for $7.80", "4 bottles of water for $5.60", "They cost the same", "Cannot tell"], "how": "4 bottles: 5.60 ÷ 4 = $1.40 each. 6 bottles: 7.80 ÷ 6 = $1.30 each. The lower unit price is the better buy.", "fig": null, "work": null, "mod": "m4"}, {"id": "l16-5", "q": "A jet uses 3,600 gallons of fuel in 4 hours. How many gallons does it use per minute? (There are 60 minutes in 1 hour.)", "a": "15", "choices": ["15", "900", "240", "150"], "how": "4 hours is 240 minutes. 3,600 ÷ 240 = 15 gallons per minute.", "fig": null, "work": null, "mod": "m4"}]}, {"id": "l17", "mod": "m4", "title": "Using Ratios to Convert Measurement Units", "idea": "A conversion fact is a ratio, such as 12 inches to 1 foot. Multiply or divide by that ratio to change units.", "points": ["Write the conversion fact as a ratio.", "Going from a bigger unit to a smaller unit: multiply. Going from a smaller unit to a bigger unit: divide.", "Include the unit in your answer and check that it makes sense."], "ex_q": "Convert 7 feet to inches. There are 12 inches in 1 foot.", "ex_steps": ["Write the ratio 12 inches to 1 foot.", "Decide whether you multiply or divide.", "Compute and label the answer with its unit."], "qs": [{"id": "l17-1", "q": "There are 3 feet in 1 yard. A runway is 1,200 yards long. How many feet is that?", "a": "3,600", "choices": ["3,600", "400", "1,203", "36,000"], "how": "Feet are smaller than yards, so there are more feet. Multiply: 1,200 × 3 = 3,600.", "fig": null, "work": null, "mod": "m4"}, {"id": "l17-2", "q": "There are 100 centimeters in 1 meter. A wing is 8.5 meters long. How many centimeters long is it?", "a": "850", "choices": ["850", "0.085", "85", "8,500"], "how": "Centimeters are smaller than meters, so multiply by 100: 8.5 × 100 = 850.", "fig": null, "work": null, "mod": "m4"}, {"id": "l17-3", "q": "There are 16 ounces in 1 pound. A cargo box weighs 144 ounces. How many pounds is that?", "a": "9", "choices": ["9", "2,304", "128", "160"], "how": "Pounds are bigger than ounces, so divide: 144 ÷ 16 = 9.", "fig": null, "work": null, "mod": "m4"}, {"id": "l17-4", "q": "A plane flies 480 miles per hour. How many miles does it fly in 1 minute? (There are 60 minutes in 1 hour.)", "a": "8", "choices": ["8", "28,800", "420", "480"], "how": "In 1 hour it flies 480 miles. One minute is 1/60 of an hour: 480 ÷ 60 = 8 miles.", "fig": null, "work": null, "mod": "m4"}, {"id": "l17-5", "q": "There are 1,000 milliliters in 1 liter. A fuel tank holds 12.5 liters. How many milliliters is that?", "a": "12,500", "choices": ["12,500", "0.0125", "125", "1,250"], "how": "Milliliters are smaller than liters, so multiply by 1,000: 12.5 × 1,000 = 12,500.", "fig": null, "work": null, "mod": "m4"}]}, {"id": "l18", "mod": "m5", "title": "Percent as a Rate per 100; Fractions, Decimals and Percents", "idea": "Percent means per 100. Fractions, decimals, and percents are three ways to name the same amount.", "points": ["Percent means out of 100: 47% = 47/100 = 0.47.", "Fraction to percent: divide the top by the bottom, then multiply by 100 (or find an equivalent fraction over 100).", "Percent to decimal: move the decimal point 2 places left. Decimal to percent: move it 2 places right."], "ex_q": "Write 7/25 as a percent.", "ex_steps": ["Make an equivalent fraction with a denominator of 100.", "Read the numerator as the percent.", "Write the same amount as a decimal to check."], "qs": [{"id": "l18-1", "q": "A cabin has 47 out of 100 seats filled. What percent is that?", "a": "47%", "choices": ["47%", "53%", "4.7%", "147%"], "how": "Percent means out of 100, so 47 out of 100 is 47%.", "fig": null, "work": null, "mod": "m5"}, {"id": "l18-2", "q": "Write 3/20 as a percent.", "a": "15%", "choices": ["15%", "20%", "3%", "1.5%"], "how": "Multiply the top and bottom by 5 to get 15/100. 15 out of 100 is 15%.", "fig": null, "work": null, "mod": "m5"}, {"id": "l18-3", "q": "Write 0.08 as a percent.", "a": "8%", "choices": ["8%", "80%", "0.8%", "0.08%"], "how": "Move the decimal point 2 places to the right: 0.08 becomes 8%.", "fig": null, "work": null, "mod": "m5"}, {"id": "l18-4", "q": "Write 72% as a fraction in simplest form.", "a": "18/25", "choices": ["18/25", "72/10", "36/50", "18/20"], "how": "72% = 72/100. Divide the top and bottom by their GCF, 4, to get 18/25.", "fig": null, "work": null, "mod": "m5"}, {"id": "l18-5", "q": "Which is the greatest: 0.45, 2/5, 48%, or 0.5%?", "a": "48%", "choices": ["48%", "0.45", "2/5", "0.5%"], "how": "Write them all as decimals: 0.45, 0.4, 0.48, and 0.005. The greatest is 0.48, which is 48%.", "fig": null, "work": null, "mod": "m5"}]}, {"id": "l19", "mod": "m5", "title": "Finding a Percent of a Quantity", "idea": "To find a percent of an amount, change the percent to a decimal and multiply, or use easy benchmarks like 10% and 50%.", "points": ["Percent of a quantity = percent (as a decimal) × the whole.", "10% is one tenth of the amount. 50% is half. 25% is a quarter.", "Build other percents from benchmarks: 30% is 3 × 10%."], "ex_q": "Find 30% of 90.", "ex_steps": ["Find 10% of 90 first.", "Use the benchmark to build 30%.", "Check by multiplying 0.30 × 90."], "qs": [{"id": "l19-1", "q": "Find 10% of 350.", "a": "35", "choices": ["35", "3.5", "350", "385"], "how": "10% is one tenth. Divide 350 by 10 to get 35.", "fig": null, "work": null, "mod": "m5"}, {"id": "l19-2", "q": "Find 40% of 65.", "a": "26", "choices": ["26", "2.6", "260", "25"], "how": "0.40 × 65 = 26. Or find 10% (6.5) and multiply by 4.", "fig": null, "work": null, "mod": "m5"}, {"id": "l19-3", "q": "A flight has 120 passengers. 55% are traveling for vacation. How many passengers are traveling for vacation?", "a": "66", "choices": ["66", "55", "6.6", "65"], "how": "0.55 × 120 = 66. Or 50% is 60 and 5% is 6, and 60 + 6 = 66.", "fig": null, "work": null, "mod": "m5"}, {"id": "l19-4", "q": "A pilot’s 8-hour shift is 25% paperwork. How many hours of paperwork is that?", "a": "2", "choices": ["2", "4", "6", "0.25"], "how": "25% is one quarter. 8 ÷ 4 = 2 hours.", "fig": null, "work": null, "mod": "m5"}, {"id": "l19-5", "q": "Find 6% of 450.", "a": "27", "choices": ["27", "2.7", "270", "456"], "how": "0.06 × 450 = 27. Or 1% is 4.5 and 6 × 4.5 = 27.", "fig": null, "work": null, "mod": "m5"}]}, {"id": "l20", "mod": "m5", "title": "Finding the Whole Given a Part and the Percent", "idea": "If you know a part and what percent it is, divide to find the whole. Dividing by the percent undoes multiplying by the percent.", "points": ["Whole = part ÷ percent (as a decimal).", "Or find 1% by dividing the part by the percent, then multiply by 100.", "Check by finding the percent of your answer."], "ex_q": "27 is 45% of what number?", "ex_steps": ["Change 45% to a decimal.", "Divide the part by that decimal.", "Check: find 45% of your answer and compare to 27."], "qs": [{"id": "l20-1", "q": "21 is 30% of a number. What is the number?", "a": "70", "choices": ["70", "6.3", "630", "49"], "how": "Whole = part ÷ percent = 21 ÷ 0.30 = 70. Check: 30% of 70 is 21.", "fig": null, "work": null, "mod": "m5"}, {"id": "l20-2", "q": "There are 75 first-class passengers. They are 25% of all passengers. How many passengers are there in all?", "a": "300", "choices": ["300", "18.75", "100", "1,875"], "how": "25% is one quarter, so the whole is 4 times the part: 75 × 4 = 300.", "fig": null, "work": null, "mod": "m5"}, {"id": "l20-3", "q": "12 is 8% of a number. What is the number?", "a": "150", "choices": ["150", "0.96", "96", "1.5"], "how": "12 ÷ 0.08 = 150. Check: 8% of 150 is 12.", "fig": null, "work": null, "mod": "m5"}, {"id": "l20-4", "q": "A fuel gauge shows 45 gallons, which is 60% of the tank. How many gallons does the full tank hold?", "a": "75", "choices": ["75", "27", "105", "450"], "how": "45 ÷ 0.60 = 75. Check: 60% of 75 is 45.", "fig": null, "work": null, "mod": "m5"}, {"id": "l20-5", "q": "A pilot has flown 40 hours, which is 80% of the required hours. How many hours are required?", "a": "50", "choices": ["50", "32", "48", "5"], "how": "40 ÷ 0.80 = 50. Check: 80% of 50 is 40.", "fig": null, "work": null, "mod": "m5"}]}, {"id": "l21", "mod": "m5", "title": "Percent Problem Solving in Real-World Contexts", "idea": "Percent problems come up with discounts, taxes, raises, and records. Decide whether you are finding the part, the whole, or the percent.", "points": ["Sale price = original price − discount. Total with tax = price + tax.", "Percent = part ÷ whole × 100.", "Read carefully: what are you asked to find, and what do you already know?"], "ex_q": "A $64 ticket is 25% off. What is the sale price?", "ex_steps": ["Find 25% of $64 to get the discount.", "Subtract the discount from the original price.", "Check that the sale price is less than the original price."], "qs": [{"id": "l21-1", "q": "A $250 ticket is 20% off. What is the sale price?", "a": "$200", "choices": ["$200", "$50", "$270", "$20"], "how": "20% of 250 is 50 (that is the discount). Sale price = 250 − 50 = $200.", "fig": null, "work": null, "mod": "m5"}, {"id": "l21-2", "q": "A bag fee is $30. A 10% tax is added. What is the total?", "a": "$33", "choices": ["$33", "$3", "$300", "$27"], "how": "10% of 30 is 3. The total is 30 + 3 = $33.", "fig": null, "work": null, "mod": "m5"}, {"id": "l21-3", "q": "A flight has 160 seats and 128 are filled. What percent of the seats are filled?", "a": "80%", "choices": ["80%", "20%", "128%", "8%"], "how": "Percent = part ÷ whole × 100 = 128 ÷ 160 × 100 = 80%.", "fig": null, "work": null, "mod": "m5"}, {"id": "l21-4", "q": "A pilot earns $40 per hour and gets a 15% raise. What is the new hourly pay?", "a": "$46", "choices": ["$46", "$6", "$55", "$60"], "how": "15% of 40 is 6 (the raise). New pay = 40 + 6 = $46.", "fig": null, "work": null, "mod": "m5"}, {"id": "l21-5", "q": "On-time record: 45 of 60 flights landed on time. What percent landed on time?", "a": "75%", "choices": ["75%", "25%", "45%", "60%"], "how": "45 ÷ 60 = 0.75, which is 75%.", "fig": null, "work": null, "mod": "m5"}]}];

function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmtTime(s){const m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,"0");}

/* ===== answer parsing and grading ===== */
function clean(raw){return String(raw).trim().toLowerCase().replace(/[−–—]/g,"-").replace(/[$%,]/g,"").replace(/\s+/g," ").replace(/[a-z°.\s]+$/,"").trim();}
function parseNum(raw){
 let s=clean(raw);if(!s)return null;let neg=false;if(s[0]==="-"){neg=true;s=s.slice(1).trim();}
 let m;const sg=n=>neg?-n:n;
 if(m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/)){const w=+m[1],a=+m[2],b=+m[3];if(!b)return null;return{n:sg(w*b+a),d:b,frac:true,mixed:true,reduced:gcd(a,b)===1&&a<b};}
 if(m=s.match(/^(\d+)\s*\/\s*(\d+)$/)){const a=+m[1],b=+m[2];if(!b)return null;return{n:sg(a),d:b,frac:true,mixed:false,reduced:gcd(a,b)===1};}
 if(m=s.match(/^(\d*)\.(\d+)$/)||s.match(/^(\d+)()$/)){const ip=m[1]||"0",dp=m[2]||"";const d=Math.pow(10,dp.length);let n=+(ip+dp);const g=gcd(n,d)||1;return{n:sg(n/g),d:d/g,frac:false,mixed:false,reduced:true};}
 return null;
}
const same=(a,b)=>a.n*b.d===b.n*a.d;
function splitList(v){const s=String(v);return (/[,;]/.test(s)?s.split(/[,;]+/):s.trim().split(/\s+/)).map(x=>x.trim()).filter(Boolean);}
function parseRatio(raw){const s=String(raw).trim().toLowerCase().replace(/\s*to\s*/g,":").replace(/\s+/g,"");const m=s.match(/^(\d+):(\d+)$/);return m?[+m[1],+m[2]]:null;}
function gradeQ(q,val){
 if(val==null||String(val).trim()==="")return{ok:false,bad:true,msg:"Type or choose an answer first."};
 const d=dec(q);
 if(q.t==="mc")return{ok:val===d.a};
 if(q.t==="num"){const g=parseNum(val);if(!g)return{ok:false,bad:true,msg:"Type a number, a fraction like 3/4, or a mixed number like 2 1/2."};
  const w=parseNum(d.a);if(!same(g,w))return{ok:false};
  if(d.exact){return(g.frac===w.frac&&g.mixed===w.mixed&&g.n===w.n&&g.d===w.d)?{ok:true}:{ok:false,msg:"That is the right amount, but write it in the form the problem asks for."};}
  if(g.frac&&!g.reduced)return{ok:false,msg:"That is the right amount, but it is not in simplest form. Simplify it and check again."};
  return{ok:true};}
 if(q.t==="list"){const want=d.a.map(parseNum),got=splitList(val).map(parseNum);
  if(got.some(x=>!x))return{ok:false,bad:true,msg:"Type numbers separated by commas."};
  if(got.length!==want.length)return{ok:false};
  return{ok:want.every((w,i)=>same(w,got[i]))};}
 if(q.t==="ratio"){const g=parseRatio(val),w=parseRatio(d.a);if(!g)return{ok:false,bad:true,msg:"Write the ratio like 3:5."};
  if(g[0]*w[1]!==g[1]*w[0])return{ok:false};
  if(gcd(g[0],g[1])!==1)return{ok:false,msg:"That is an equivalent ratio, but it is not in simplest form."};
  return{ok:true};}
 return{ok:false};
}
function answerText(q){const d=dec(q);if(q.t==="list")return d.a.join(", ");return d.a;}

function loadLocal(){try{const x=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(x&&x.a){x.p=x.p||{};x.miles=x.miles||0;x.drag=x.drag||0;return x;}}catch(e){}return null;}
function setStatus(t){const e=$("#savestat");if(e)e.textContent=t;}

/* ===== grades ===== */
function scorable(id){return QS[id].filter(q=>q.t!=="text");}
function result(it){
 const a=S.a[it.id];if(!a)return null;const qs=scorable(it.id);
 const total=qs.reduce((s,q)=>s+q.pts,0);
 const earned=qs.reduce((s,q)=>s+(a.ok[q.id]?q.pts:0),0);
 const first=qs.reduce((s,q)=>s+(a.first[q.id]===true?q.pts:0),0);
 let done,started=Object.keys(a.ans).length>0||Object.keys(a.tries).length>0||a.started;
 if(it.type==="hw")done=qs.every(q=>a.ok[q.id]);else done=!!a.submitted;
 return{earned,total,pct:total?earned/total*100:0,firstPct:total?first/total*100:0,done,started:!!started};
}
function itemWeight(it){const n=ITEMS.filter(x=>x.cat===it.cat).length;return CFG.weights[it.cat]/n;}
function termGrade(){
 let num=0,den=0;ITEMS.forEach(it=>{const r=result(it);if(r&&r.done){const w=itemWeight(it);num+=w*r.pct;den+=w;}});
 return den?num/den:null;
}
function rankFor(g){if(g===null)return"Cadet";if(g>=90)return"Captain";if(g>=80)return"First Officer";if(g>=70)return"Pilot";return"Student Pilot";}

/* ===== work area ===== */
function niceStep(r){const c=[1,2,5,10,20,25,50,100,200];const t=r/10;return c.find(x=>x>=t)||250;}
function nlBg(lo,hi){
 const x0=50,x1=650,y=200,step=niceStep(hi-lo),sx=v=>x0+(v-lo)*(x1-x0)/(hi-lo);
 let s=`<svg viewBox="0 0 700 400" preserveAspectRatio="xMidYMid meet"><line x1="${x0-24}" y1="${y}" x2="${x1+24}" y2="${y}" stroke="#14213d" stroke-width="4"/><path d="M${x0-24} ${y} l14 -9 v18z M${x1+24} ${y} l-14 -9 v18z" fill="#14213d"/>`;
 for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step){const c=v===0;s+=`<line x1="${sx(v)}" y1="${y-(c?20:14)}" x2="${sx(v)}" y2="${y+(c?20:14)}" stroke="${c?"#DD0426":"#14213d"}" stroke-width="${c?4:3}"/><text x="${sx(v)}" y="${y+46}" text-anchor="middle" font-size="24" font-weight="800" fill="${c?"#DD0426":"#14213d"}">${v}</text>`;}
 return s+"</svg>";
}
function planeBg(x0,x1,y0,y1){
 const W=700,H=Math.round(W*(y1-y0)/(x1-x0)),pad=34,sx=v=>pad+(v-x0)*(W-2*pad)/(x1-x0),sy=v=>pad+(y1-v)*(H-2*pad)/(y1-y0);
 let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
 for(let v=x0;v<=x1;v++){s+=`<line x1="${sx(v)}" y1="${pad}" x2="${sx(v)}" y2="${H-pad}" stroke="${v===0?"#14213d":"#b8c7da"}" stroke-width="${v===0?3.5:1.3}"/>`;if(v!==0)s+=`<text x="${sx(v)}" y="${sy(0)+20}" text-anchor="middle" font-size="16" font-weight="700" fill="#14213d">${v}</text>`;}
 for(let v=y0;v<=y1;v++){s+=`<line x1="${pad}" y1="${sy(v)}" x2="${W-pad}" y2="${sy(v)}" stroke="${v===0?"#14213d":"#b8c7da"}" stroke-width="${v===0?3.5:1.3}"/>`;if(v!==0)s+=`<text x="${sx(0)-8}" y="${sy(v)+5}" text-anchor="end" font-size="16" font-weight="700" fill="#14213d">${v}</text>`;}
 return s+"</svg>";
}
function workHTML(q){
 let bg="",cls="blank",ar="7/4";
 if(q.work&&q.work.startsWith("nl:")){const[,a,b]=q.work.split(":");bg=nlBg(+a,+b);cls="";}
 else if(q.work&&q.work.startsWith("plane:")){const[,a,b,c,d]=q.work.split(":").map((x,i)=>i?+x:x);bg=planeBg(a,b,c,d);cls="";ar=(b-a)+"/"+(d-c);}
 const colors=["#14213d","#DD0426","#1f6fd1","#0a8a37"];
 return `<div class="card work"><div class="wtools"><b>Work area</b>${colors.map((c,i)=>`<button class="dot${i===0?" sel":""}" data-c="${c}" style="background:${c}" aria-label="Pen color ${i+1}"></button>`).join("")}<button class="ghost" id="weras">Eraser</button><button class="ghost" id="wclr">Clear</button></div><div class="wbox ${cls}" id="wbox" style="aspect-ratio:${ar}">${bg}<canvas id="wcv"></canvas></div><p class="tip">Draw, graph, or show your work here. Your drawing is not graded.</p></div>`;
}
function mountWork(q){
 const cv=$("#wcv"),box=$("#wbox");if(!cv)return;
 const r=box.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
 cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);
 const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);ctx.lineCap="round";ctx.lineJoin="round";
 if(DRAW[q.id]){const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0,r.width,r.height);};img.src=DRAW[q.id];}
 let color="#14213d",erase=false,down=false,lx=0,ly=0;
 const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
 cv.addEventListener("pointerdown",e=>{down=true;[lx,ly]=pos(e);cv.setPointerCapture(e.pointerId);e.preventDefault();});
 cv.addEventListener("pointermove",e=>{if(!down)return;const[x,y]=pos(e);ctx.globalCompositeOperation=erase?"destination-out":"source-over";ctx.strokeStyle=color;ctx.lineWidth=erase?26:3.5;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();lx=x;ly=y;});
 const up=()=>{if(down){down=false;DRAW[q.id]=cv.toDataURL();}};
 cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
 document.querySelectorAll(".wtools .dot").forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;document.querySelectorAll(".wtools .dot").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");});
 $("#weras").onclick=()=>{erase=true;document.querySelectorAll(".wtools .dot").forEach(x=>x.classList.remove("sel"));};
 $("#wclr").onclick=()=>{ctx.globalCompositeOperation="source-over";ctx.clearRect(0,0,r.width,r.height);delete DRAW[q.id];};
}

/* ===== modal ===== */
function modal(html){const m=$("#modal");m.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;return m;}
function closeModal(){const m=$("#modal");m.hidden=true;m.innerHTML="";}
function askCode(title,msg){
 return new Promise(res=>{
  modal(`<h2>${esc(title)}</h2><p>${esc(msg)}</p><input type="text" id="codein" autocomplete="off" autocapitalize="characters" aria-label="Code"><div class="msg bad" id="codemsg"></div><div class="row"><button id="codeok">Continue</button><button class="ghost" id="codeno">Cancel</button></div>`);
  const inp=$("#codein");inp.focus();
  const go=()=>{res(inp.value.trim());closeModal();};
  $("#codeok").onclick=go;$("#codeno").onclick=()=>{res(null);closeModal();};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
 });
}

 modal(`<h2>Flight manual</h2>${mods.map(m=>`<div class="manual"><h3 style="font-size:23px;margin-top:10px">${esc(MANUAL[m].title)}</h3>${manualHTML(m)}</div>`).join("")}<div class="row"><button id="mclose">Close</button></div>`);
 $("#mclose").onclick=closeModal;

function bindTop(){}
function statusOf(it){
 const r=result(it);if(!r||!r.started)return{t:"Not started",c:""};
 if(it.type==="hw"){const n=scorable(it.id).filter(q=>A(it.id).ok[q.id]).length;return r.done?{t:`Complete: ${r.pct.toFixed(0)}%`,c:"done"}:{t:`In progress: ${n} of ${scorable(it.id).length} correct`,c:"prog"};}
 return r.done?{t:`Submitted: ${r.pct.toFixed(0)}%`,c:"done"}:{t:"In progress",c:"prog"};
}
const TYPE_LABEL={hw:"Homework",exam:"Exam",term:"Term exam",project:"Project"};
const TABS=[{id:"learn",label:"Learning and Guided Practice"},{id:"hw",label:"Homework"},{id:"exams",label:"Exams"},{id:"end",label:"End of Term: Exam and Project"}];
function starSVG(on){return `<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.6 7.1L12 17.6 5.6 21.4l1.6-7.1L1.8 9.4 9 8.6z" fill="${on?"#f2b705":"none"}" stroke="${on?"#b98700":"#9aa8bd"}" stroke-width="1.6"/></svg>`;}
function itemCard(it){

 const mods=["m1","m2","m3","m4","m5"];

}
function home(){
 V={view:"home"};
 const g=termGrade(),done=ITEMS.filter(it=>{const r=result(it);return r&&r.done;}).length;
 const lessonsDone=LESSONS.filter(l=>S.p[l.id]&&S.p[l.id].done).length;
 const mins=Math.round(ITEMS.reduce((s,it)=>s+((S.a[it.id]&&S.a[it.id].secs)||0),0)/60);
 const tabs=`<div class="tabs" role="tablist">${TABS.map(t=>`<button class="tab${TAB===t.id?" on":""}" role="tab" aria-selected="${TAB===t.id}" data-tab="${t.id}">${t.label}</button>`).join("")}</div>`;
 let body;
