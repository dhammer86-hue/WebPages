<!DOCTYPE html>

<head>

<title>Alex’s Pilot Academy: Math 6</title>
<style>
:root{--bg:#eef5fb;--ink:#14213d;--soft:#4a5a75;--accent:#DD0426;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1627;--ink:#eef4fb;--soft:#b5c4da;--accent:#ff5a73;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;font-size:19px;line-height:1.45}
main{max-width:560px;margin:60px auto;padding:0 16px;text-align:center}

</style>

<body>
<main>
<h1>Taking you to Pilot Academy...</h1>
<p>Sign in with your school Google account if Google asks.</p>
<p><a id="go" href="https://script.google.com/a/macros/cga.school/s/AKfycbzROeWNEUF1itw7WKoDnJCxLHgxmWeXtpHHNekOFsmCJodi0R2g9zjNbFZ6HDextM-Bkw/exec">Open Pilot Academy</a></p>
</main>
<script>
// Pilot Academy now saves progress to each student's school account.
// Progress saved in this browser by the old page rides along once so nothing is lost.
var APP = document.getElementById("go").href;
var target = APP;
try {
  var old = localStorage.getItem("m6t1:alex");
  if (old && old.length < 500000) {
    target = APP + "#import=" + encodeURIComponent(btoa(unescape(encodeURIComponent(old))));
  }
} catch (e) {}
document.getElementById("go").href = target;
location.replace(target);
</script>
</body>
