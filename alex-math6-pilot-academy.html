<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alex’s Pilot Academy: Math 6</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://dhammer86-hue.github.io/WebPages/pilot-academy-app/app.css">
</head>
<body style="font-family:system-ui,sans-serif">
<div id="app"><p id="pilotmsg" style="text-align:center;margin-top:60px;font-size:20px;color:#4a5a75;background:#eef5fb;padding:20px;border-radius:12px">Loading Pilot Academy...</p></div>
<div id="modal" hidden></div>
<script>
function pilotProblem(text) {
  var m = document.getElementById("pilotmsg");
  if (m) m.textContent = "Pilot Academy could not start. Please send this to your teacher: " + text;
}
window.addEventListener("error", function (e) { pilotProblem(e.message || "a file did not load"); });
(function () {
  try {
    // Before sign-in was optional this link always went to the account, so anyone with
    // progress saved here from back then keeps going to their account.
    var old = localStorage.getItem("m6t1:alex");
    if (location.hash === "#signout") {
      localStorage.removeItem("pilot:account");
      localStorage.removeItem("m6t1:alex");
      history.replaceState(null, "", location.pathname);
    } else if (!localStorage.getItem("pilot:v2") && old) {
      localStorage.setItem("pilot:account", "1");
    }
    localStorage.setItem("pilot:v2", "1");
    if (localStorage.getItem("pilot:account") === "1") {
      var u = "https://script.google.com/a/macros/cga.school/s/AKfycbzROeWNEUF1itw7WKoDnJCxLHgxmWeXtpHHNekOFsmCJodi0R2g9zjNbFZ6HDextM-Bkw/exec", s = localStorage.getItem("m6t1:alex");
      if (s && s.length < 500000) u += "#import=" + encodeURIComponent(btoa(unescape(encodeURIComponent(s))));
      window.PILOT_LEAVING = true;
      location.replace(u);
    }
  } catch (e) {}
})();
</script>
<script>if (!window.PILOT_LEAVING) document.write("<script src=\"https://dhammer86-hue.github.io/WebPages/pilot-academy-app/app.js\" onerror=\"pilotProblem('app.js did not load')\"><\/script>");</script>
</body>
</html>
