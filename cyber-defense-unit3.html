<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyber Defense Academy: Unit 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@500;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060B14;--panel:#0C1626;--panel2:#09111F;--ink:#E6F1FF;--soft:#93AAC4;--acc:#00E5FF;--acc-ink:#03131A;--acc2:#39FF88;--warn:#FFB800;--warn-ink:#241800;--bad:#FF4D6D;--line:#21395A;--track:#1D4A6B;--ok-bg:rgba(57,255,136,.12);--bad-bg:rgba(255,77,109,.13);--grid:rgba(0,229,255,.055);--glow:0 0 18px rgba(0,229,255,.28);--glow-ok:0 0 20px rgba(57,255,136,.4);--glow-bad:0 0 20px rgba(255,77,109,.4);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme="light"]{--bg:#EAF2F9;--panel:#FFFFFF;--panel2:#F2F7FB;--ink:#0A1A2A;--soft:#44596F;--acc:#006F8A;--acc-ink:#FFFFFF;--acc2:#0B7A43;--warn:#E8A200;--warn-ink:#2A1C00;--bad:#C01036;--line:#BCD0E2;--track:#9DBAD2;--ok-bg:rgba(11,122,67,.1);--bad-bg:rgba(192,16,54,.09);--grid:rgba(0,111,138,.08);--glow:none;--glow-ok:none;--glow-bad:none;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(ellipse at 50% -10%,rgba(0,229,255,.13),transparent 60%);background-size:44px 44px,44px 44px,100% 100%;background-attachment:fixed;color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--warn);outline-offset:3px}
.wrap{max-width:800px;margin:0 auto;padding:20px 18px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{background:#F7F3EA;border-radius:10px;padding:6px 10px;display:flex;align-items:center;box-shadow:0 0 0 1px var(--line)}
.logo img{height:38px;width:auto;display:block}
h1{font-family:Orbitron,"Segoe UI",sans-serif;font-weight:800;font-size:clamp(20px,4.6vw,30px);line-height:1.1;margin:0;color:var(--acc);letter-spacing:.06em;text-transform:uppercase;text-shadow:var(--glow)}
.status{font-family:"JetBrains Mono",Consolas,monospace;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--acc2);margin:6px 0 4px}
.status:after{content:"_";margin-left:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-family:"JetBrains Mono",Consolas,monospace;font-weight:700;font-size:14px}
.chip svg{width:18px;height:18px}
.sub{color:var(--soft);margin:0 0 16px;font-size:17px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;font-family:"JetBrains Mono",Consolas,monospace;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tab:hover{border-color:var(--acc)}
.tab.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);box-shadow:var(--glow)}
.themebtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 12px;font-family:"JetBrains Mono",Consolas,monospace;font-weight:700;font-size:13px}
.trail{list-style:none;margin:0;padding:0;position:relative}
.trail:before{content:"";position:absolute;left:32px;top:30px;bottom:30px;width:0;border-left:3px dashed var(--track)}
.stop{position:relative;display:flex;align-items:center;gap:16px;padding:9px 0}
.token{position:relative;z-index:1;flex:none;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-family:Orbitron,sans-serif;font-weight:800;font-size:22px;background:var(--panel);border:3px solid var(--track);color:var(--soft)}
.stop.done .token{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:var(--glow)}
.stop.upnext .token{background:var(--warn);border-color:var(--warn);color:var(--warn-ink);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,184,0,.55)}100%{box-shadow:0 0 0 14px rgba(255,184,0,0)}}
.stop.locked{opacity:.5}
.stopbody,.hwrow{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--track);border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stop.done .stopbody{border-left-color:var(--acc)}
.stop.upnext .stopbody{border-left-color:var(--warn)}
.hwrow{margin-bottom:12px;flex:none}
.stopname{font-family:Orbitron,sans-serif;font-weight:600;font-size:16px;line-height:1.25;letter-spacing:.02em}
.stopmeta{font-family:"JetBrains Mono",Consolas,monospace;color:var(--soft);font-size:13px;margin-top:2px}
.stars{display:flex;gap:2px}
.stars svg{width:22px;height:22px}
.play{flex:none;border:0;border-radius:8px;padding:10px 16px;font-family:"JetBrains Mono",Consolas,monospace;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;background:var(--acc);color:var(--acc-ink)}
.play:hover:not(:disabled){box-shadow:var(--glow)}
.stop.upnext .play{background:var(--warn);color:var(--warn-ink)}
.play:disabled{background:var(--track);color:var(--soft);cursor:default;opacity:.7}
.reset{margin-top:28px;background:none;border:0;color:var(--soft);text-decoration:underline;padding:4px;font-family:"JetBrains Mono",Consolas,monospace;font-size:13px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.back{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 14px;color:var(--ink);font-family:"JetBrains Mono",Consolas,monospace;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:14px;height:14px;border-radius:3px;background:var(--track)}
.dot.ok{background:var(--acc2);box-shadow:var(--glow-ok)}.dot.miss{background:var(--bad);box-shadow:var(--glow-bad)}.dot.now{outline:2px solid var(--acc);outline-offset:2px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:var(--glow)}
.card:before,.card:after{content:"";position:absolute;width:16px;height:16px;pointer-events:none}
.card:before{top:-1px;left:-1px;border-top:3px solid var(--acc);border-left:3px solid var(--acc);border-top-left-radius:14px}
.card:after{bottom:-1px;right:-1px;border-bottom:3px solid var(--acc);border-right:3px solid var(--acc);border-bottom-right-radius:14px}
.area{font-family:"JetBrains Mono",Consolas,monospace;font-weight:700;color:var(--acc);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
.redotag{display:inline-block;margin-left:8px;padding:1px 10px;border-radius:6px;background:var(--warn);color:var(--warn-ink);font-size:12px;font-weight:700}
.qtext{font-family:Inter,sans-serif;font-weight:700;font-size:clamp(20px,4vw,25px);line-height:1.3;margin:0 0 16px}
.fig{background:#04090F;color:#CFF7E0;border:1px solid #21395A;border-radius:10px;padding:12px;margin:0 0 16px;overflow-x:auto}
.fig p{color:#CFF7E0}
.fig code{color:#00E5FF;background:#0A1626;padding:1px 6px;border-radius:4px;font-family:"JetBrains Mono",Consolas,monospace;font-size:14px}
.fig table{border-collapse:collapse;margin:0 auto;font-size:15px;font-family:"JetBrains Mono",Consolas,monospace}
.fig th,.fig td{border:1px solid #21395A;padding:5px 11px;text-align:left}
.fig th{background:#0E2236;color:#00E5FF;font-weight:700}
.fig pre{margin:0;text-align:left;font-family:"JetBrains Mono",Consolas,monospace;font-size:14px;line-height:1.5;white-space:pre-wrap;color:#7CFFB2}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:14px 16px;font-weight:700;font-size:17px;min-height:68px;transition:transform .12s,border-color .12s}
.tile:hover:not(:disabled){border-color:var(--acc);box-shadow:var(--glow)}
.tile .k{flex:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-family:"JetBrains Mono",Consolas,monospace;font-size:14px;color:var(--acc)}
.tile.right{border-color:var(--acc2);background:var(--ok-bg);box-shadow:var(--glow-ok)}
.tile.right .k{background:var(--acc2);border-color:var(--acc2);color:#04210f}
.tile.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:var(--glow-bad)}
.tile.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.tile:disabled{cursor:default;color:var(--ink)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{margin-top:16px;border-radius:10px;padding:14px 16px;display:none}
.feedback.show{display:block}
.feedback.good{background:var(--ok-bg);border-left:4px solid var(--acc2)}
.feedback.retry,.feedback.reveal{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fbtitle{font-family:Orbitron,sans-serif;font-weight:600;font-size:17px;letter-spacing:.03em;margin:0 0 4px}
.how{margin:6px 0 0}
.how b{color:var(--acc)}
.next{margin-top:14px;border:0;border-radius:8px;padding:12px 22px;background:var(--acc);color:var(--acc-ink);font-family:"JetBrains Mono",Consolas,monospace;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.next:hover{box-shadow:var(--glow)}
.finish{text-align:center;padding:30px 22px}
.bigstars{display:flex;justify-content:center;gap:10px;margin:14px 0;filter:drop-shadow(0 0 8px rgba(255,184,0,.45))}
.bigstars svg{width:64px;height:64px}
.finish h2{font-family:Orbitron,sans-serif;font-weight:800;font-size:clamp(22px,5vw,30px);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;color:var(--acc);text-shadow:var(--glow)}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.ghost{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:12px 18px;font-family:"JetBrains Mono",Consolas,monospace;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.ghost:hover{border-color:var(--acc)}
.tip{margin:16px auto 0;max-width:580px;border:2px dashed var(--warn);border-radius:12px;padding:14px 18px;background:var(--panel2);text-align:left}
.tip h3{font-family:"JetBrains Mono",Consolas,monospace;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);margin:0 0 6px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:15px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.shake{animation:none}.tile{transition:none}.status:after{animation:none}.stop.upnext .token{animation:none}}
h3.sec{font-family:Orbitron,sans-serif;font-weight:600;color:var(--acc);margin:0 0 8px;font-size:19px;letter-spacing:.03em}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--panel2);color:var(--ink);resize:vertical}
textarea:focus,.txtin:focus,.numin:focus{border-color:var(--acc);outline:none;box-shadow:var(--glow)}
.part{margin:14px 0}
.part p{margin:0 0 6px}
.model{margin-top:8px;background:var(--ok-bg);border-left:4px solid var(--acc2);border-radius:8px;padding:10px 14px}
.selfrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.self{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:5px 12px;font-family:"JetBrains Mono",Consolas,monospace;font-weight:700;font-size:13px}
.self.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.grid60{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:12px 0}
.num{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:6px 0;font-family:"JetBrains Mono",Consolas,monospace;font-weight:700;font-size:15px}
.num small{display:block;font-size:11px;color:var(--soft);font-weight:700;line-height:1}
.num.on{background:var(--acc2);border-color:var(--acc2);color:#04210f;box-shadow:var(--glow-ok)}
.num.on small{color:#04210f}
.meter{height:14px;background:var(--track);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.urow{margin:10px 0}
.urow .l{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.weak{background:var(--warn);color:var(--warn-ink);border-radius:6px;padding:1px 10px;font-size:13px;margin-left:8px;font-family:"JetBrains Mono",Consolas,monospace}
.big{font-family:Orbitron,sans-serif;font-weight:800;font-size:clamp(28px,7vw,42px);color:var(--acc);line-height:1.1;margin:6px 0;text-shadow:var(--glow)}
.numin,.txtin{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;background:var(--panel2);color:var(--ink)}
.numin{width:96px}
.txtin{min-width:220px;max-width:100%}
details.g{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:4px 16px;margin-bottom:10px}
details.g summary{cursor:pointer;font-family:"JetBrains Mono",Consolas,monospace;font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);padding:10px 0}
details.g ul{margin:0 0 10px;padding-left:22px}
.fine{color:var(--soft);font-size:15px}
</style>
</head>

var STOPS=[
{id:'attacks',name:'Name That Attack',lo:'3.1.A and 3.1.B',tip:'Match the clue to the attack. Duplicate MAC addresses in ARP mean ARP poisoning (an on-path attack). A full switch table means MAC flooding (eavesdropping). A changed DNS record means DNS poisoning (credential harvesting). ICMP to the broadcast address means a smurf attack (DoS).',qs:[
{q:'A switch’s address table fills with thousands of fake addresses and the switch starts sending frames out of every port. Which attack is this?',a:'MAC flooding',w:['ARP poisoning','DNS poisoning','Smurf attack'],how:'MAC flooding overflows the switch’s MAC table so it broadcasts frames. The adversary can then collect them, which is eavesdropping.'},
{q:'The gateway’s ARP table shows one MAC address for several IP addresses, and traffic now passes through the adversary’s device. Which attack is this?',a:'ARP poisoning',w:['MAC flooding','DNS poisoning','Smurf attack'],how:'Falsified ARP packets link the target’s IP address to the adversary’s MAC address. That is an on-path attack, also called man-in-the-middle.'},
{q:'A school’s payment page now sends visitors to a look-alike login page because a DNS record was changed. What does the look-alike page let the adversary do?',a:'Harvest credentials',w:['Flood the network with ICMP','Capture every frame on a switch','Break Wi-Fi encryption'],how:'DNS poisoning redirects users to a fake site. Users type their real credentials and the adversary captures them.'},
{q:'An adversary sends ICMP echo requests to a network’s broadcast address using the victim’s address as the source. Every device replies to the victim. What is this?',a:'Smurf attack',w:['ARP poisoning','MAC flooding','DNS poisoning'],how:'A smurf attack floods the victim with ICMP replies. It is a denial of service attack, and many attackers at once make it a DDoS.'},
{q:'An adversary plugs a wireless access point into an open wall port inside a building. Why is this dangerous?',a:'It gives wireless access to the LAN and bypasses the firewall',w:['It encrypts all traffic on the LAN','It blocks ICMP replies','It limits the signal to one room'],how:'A rogue access point gives the adversary direct access to the LAN, even from outside the building, and bypasses any firewalls.'},
{q:'Which network makes it easiest for an adversary to join and attack from the inside?',a:'One that does not authenticate users or devices',w:['One that disabled its beacon frames','One that uses WPA3','One that uses MAC filtering'],how:'Networks that do not authenticate devices and users make it easier for adversaries to join.'}]},
{id:'risk',name:'Rate the Risk',lo:'3.1.C',tip:'Risk combines likelihood and impact. High means easy to exploit with a big impact. Moderate means the adversary mostly gains information. Low means hard to exploit with little impact. A scanner’s severity is not the same as your risk rating.',qs:[
{q:'An organization’s external firewall does not block ICMP traffic from the internet. What risk level fits best?',a:'Moderate',w:['High','Low','No risk'],how:'It can give adversaries information about the systems on the network. The CED treats that as a moderate risk.'},
{q:'One unsegmented network is reachable over wireless with weak encryption, and a web server sits on it. What risk level fits best?',a:'High',w:['Moderate','Low','No risk'],how:'An adversary could easily capture traffic, spoof a device, or launch a DoS. That is high risk.'},
{q:'Wireless access points broadcast beacon frames that show the network name and encryption type. What risk level fits best?',a:'Low',w:['High','Moderate','Critical'],how:'A beacon frame alone is hard to turn into a significant impact, so the CED calls it a low risk.'},
{q:'A scanner rates a flaw Critical, but exploiting it takes advanced skill and no exploit tool exists. What does that do to the organization’s risk assessment?',a:'It lowers the likelihood, so the risk may be lower than the scanner’s rating',w:['Scanner severity always decides the risk','Skill has no effect on likelihood','It makes the impact smaller'],how:'Likelihood depends on how hard the flaw is to exploit. Impact is a separate question.'},
{q:'A smurf attack mainly threatens which part of the CIA triad?',a:'Availability',w:['Confidentiality','Integrity','Authorization'],how:'A smurf attack floods a network so authorized users cannot use it. That is an availability problem.'}]},
{id:'policy',name:'Policies and Wireless',lo:'3.2.A and 3.2.B',tip:'Sort policy requirements by device. Router: ban local accounts, disable Telnet, require a firewall. Switch: port security and MAC filtering. VPN: allowed roles, MFA, no split tunneling. Wireless: EAP, AES, and no beacon frames.',qs:[
{q:'Which requirement belongs in a router security policy?',a:'Ban local user accounts so all logins use an approved authentication server',w:['Require MAC filtering on every port','Require EAP for wireless users','Prohibit split tunneling'],how:'Router policies may ban local accounts, disable unnecessary services such as Telnet, and require a firewall.'},
{q:'Which requirement belongs in a VPN policy?',a:'Prohibit split tunneling',w:['Disable beacon frames','Require port security','Disable Telnet on routers'],how:'VPN policies may list allowed roles, require MFA or keys, and prohibit split tunneling.'},
{q:'Why is split tunneling a risk?',a:'Some traffic bypasses the VPN and the organization’s protections',w:['All traffic is encrypted twice','VPN users cannot reach the internet','It disables multifactor authentication'],how:'With split tunneling, part of the traffic goes straight to the internet where the organization cannot protect or watch it.'},
{q:'Which wireless encryption choice is currently the strongest?',a:'WPA3',w:['WPA','WEP','WPS'],how:'WEP, WPS, and the original WPA have known vulnerabilities. WPA3 is currently the strongest.'},
{q:'Which configuration helps keep a wireless signal from reaching the parking lot?',a:'Control the access point’s broadcast direction and signal strength',w:['Turn on WPS','Switch to WEP','Enable split tunneling'],how:'Organizations can control direction and strength so the signal stays inside the space it is meant to cover.'},
{q:'Disabling beacon frames makes it harder for adversaries to do what?',a:'Find the wireless network and learn its basic properties',w:['Read the switch’s MAC table','Poison the DNS cache','Guess the VPN key'],how:'Beacon frames announce the network. Turning them off makes it harder to find, though it is not a complete defense.'}]},
{id:'seg',name:'Segmentation',lo:'3.3.A and 3.3.B',tip:'Put public-facing servers in a screened subnet. Subnets contain breaches. VLANs separate devices on shared switches. Port security limits addresses per port and stops MAC flooding.',qs:[
{q:'Where does a screened subnet (DMZ) sit?',a:'Between the internet and the internal network, holding public-facing resources',w:['Inside the internal network next to the file server','Between two internal VLANs only','On the guest Wi-Fi network'],how:'A screened subnet is a lower-security zone between public and private networks that holds public-facing resources.'},
{q:'Which resource most likely belongs in a screened subnet?',a:'A public web server',w:['A payroll database','Internal HR memos','An employee file server'],how:'Public-facing servers go in the screened subnet. Sensitive internal data stays behind the internal firewall.'},
{q:'How does subnetting help when a device is compromised?',a:'It can contain the breach and reduce the number of exposed devices',w:['It encrypts all traffic','It removes the malware','It blocks ICMP everywhere'],how:'Different subnets limit how far an adversary can reach from one compromised device.'},
{q:'What do VLANs do?',a:'Switches logically separate devices that are physically connected to central switches',w:['They assign encryption keys','They filter traffic by application','They block DNS lookups'],how:'VLANs create logical segments on shared switch hardware.'},
{q:'Port security on a switch limits the number of addresses per port. Which attack does that prevent?',a:'MAC flooding',w:['DNS poisoning','Smurf attack','Evil twin'],how:'Limiting the addresses a port can learn stops a flood of fake MAC addresses from filling the table.'},
{q:'Why does segmentation allow higher and lower security zones?',a:'Different policies and controls can apply to different segments',w:['Every segment must use the same policy','It removes the need for firewalls','It makes all devices equally trusted'],how:'Each segment can have controls that fit its data and services.'}]},
{id:'acl',name:'Read the ACL',lo:'3.4.B and 3.4.D',tip:'Read an ACL from the top. The first rule that matches runs. If nothing matches before the last rule, the final deny applies. Check direction, protocol, port, and source for each rule.',qs:[
{q:'What does the firewall do with inbound TCP traffic on port 22 from 10.20.5.14?',fig:ACL,a:'Allow it, because rule 3 matches',w:['Deny it, because rule 2 matches','Deny it, because rule 6 applies','Allow it, because rule 1 matches'],how:'10.20.5.14 is inside 10.20.5.0/24, so rule 3 matches first. Rules 1 and 2 use other ports.'},
{q:'What does the firewall do with inbound TCP traffic on port 23 from 10.20.5.14?',fig:ACL,a:'Deny it, because rule 2 matches',w:['Allow it, because rule 3 matches','Allow it, because rule 1 matches','Deny it, because rule 6 applies'],how:'Rule 2 matches port 23 from any source before the final rule is reached. Rule 3 only covers port 22.'},
{q:'What does the firewall do with inbound TCP traffic on port 8080 from 172.16.4.4?',fig:ACL,a:'Deny it, because rule 6 applies',w:['Allow it, because rule 1 matches','Allow it, because rule 3 matches','Deny it, because rule 4 matches'],how:'No earlier rule matches port 8080 from that source, so the final deny any rule applies.'},
{q:'What does the firewall do with inbound UDP port 53 traffic from 10.20.5.77?',fig:ACL,a:'Deny it, because rule 6 applies',w:['Allow it, because rule 5 matches','Allow it, because rule 3 matches','Deny it, because rule 4 matches'],how:'Rule 5 only allows the source 10.20.5.9, so 10.20.5.77 does not match. Nothing else matches before rule 6.'},
{q:'What happens if rule 6 is moved to the top of this ACL?',fig:ACL,a:'All inbound traffic is denied',w:['Nothing changes','Only TCP traffic is denied','Only port 443 is allowed'],how:'Rules run in order and rule 6 matches everything, so none of the other rules would ever run.'},
{q:'Which rule blocks inbound web traffic (TCP port 80) from the 192.168.1.0/24 network?',a:'Deny inbound TCP port 80 from 192.168.1.0/24;',w:['Allow inbound TCP port 80 from 192.168.1.0/24;','Deny outbound TCP port 80 from 192.168.1.0/24;','Deny inbound TCP port 443 from 192.168.1.0/24;'],how:'The rule needs the right action (deny), direction (inbound), port (80), and source (192.168.1.0/24).'}]},
{id:'place',name:'Place and Write Rules',lo:'3.4.A, 3.4.C, 3.4.D',tip:'Match the firewall to the job. Stateless looks at headers. Stateful tracks connections. Next-generation adds intrusion prevention, deep packet inspection, and application filtering. Put a firewall at each segment and at each point between the internal network and the internet.',qs:[
{q:'Which rule stops anyone on the guest Wi-Fi from reaching the research server over RDP (port 3389)?',fig:NET,a:'Deny, source 10.1.3.0/24, destination 10.1.2.10, port 3389',w:['Deny, source 10.1.1.0/24, destination 10.1.2.10, port 3389','Deny, source 10.1.3.0/24, destination 10.1.4.20, port 3389','Deny, source 10.1.2.0/24, destination 10.1.3.1, port 3389'],how:'The source must be the guest network and the destination must be the research server. The other choices block the wrong source or the wrong device.'},
{q:'A stateless firewall filters traffic using which information?',a:'Packet headers such as IP addresses, ports, and protocols',w:['The state of each connection','The application inside the packet','The user’s identity'],how:'Stateless filtering uses header information only.'},
{q:'A firewall tracks the state of connections and filters using connection-related rules. Which type is it?',a:'Stateful firewall',w:['Stateless firewall','Signature-based firewall','Screened subnet firewall'],how:'A stateful firewall, also called dynamic packet filtering, adds connection tracking.'},

  h+='<li class="stop'+cls+'"><div class="token">'+(i+1)+'</div><div class="stopbody"><div><div class="stopname">'+esc(s.name)+'</div><div class="stopmeta">CED '+esc(s.lo)+' | '+s.qs.length+' questions</div></div>'+stars(st.stars||0)+'<button class="play" data-act="play" data-id="'+s.id+'">'+(st.done?'Replay':'Launch')+'</button></div></li>';});
 var need=Math.min(5,UNIT.stops.length);var bossOpen=doneCount>=need;var bs=S.stops.boss||{};
 h+='<li class="stop'+(bossOpen?(bs.done?' done':' upnext'):' locked')+'"><div class="token">'+(UNIT.stops.length+1)+'</div><div class="stopbody"><div><div class="stopname">Mock Round: '+esc(UNIT.short)+' Mixed</div><div class="stopmeta">'+(bossOpen?'12 mixed questions at exam pace, about 80 seconds each':'Finish '+need+' stops to unlock')+'</div></div>'+stars(bs.stars||0)+'<button class="play" data-act="play" data-id="boss"'+(bossOpen?'':' disabled')+'>'+(bs.done?'Replay':'Launch')+'</button></div></li></ol>';
 h+='<button class="reset" data-act="reset">Reset my progress</button>';
 app.innerHTML=h;
}

function renderHw(){
 var missN=Object.keys(S.misses).length;
 var h=header()+'<div class="card"><h3 class="sec">Homework practice</h3><p>Pick the set your teacher assigned. There are no stars and no clock, and you can retry as many times as you like. When you finish a set, copy your receipt and paste it into the Learning Lab.</p><p><label>Your name <input class="txtin" type="text" id="hwname" data-act-input="hwname" value="'+esc(S.name||'')+'" placeholder="First and last name"></label></p></div>';
 (UNIT.hw||[]).forEach(function(set){var st=S.hw[set.id]||{};
  h+='<div class="hwrow"><div><div class="stopname">'+esc(set.name)+'</div><div class="stopmeta">CED '+esc(set.lo)+' | '+set.qs.length+' questions'+(st.attempts?' | Best '+st.best+' of '+set.qs.length+' | Tries '+st.attempts:'')+'</div></div><button class="play" data-act="play" data-id="hw:'+set.id+'">'+(st.attempts?'Try again':'Start')+'</button></div>';});
 h+='<div class="hwrow"><div><div class="stopname">My missed questions</div><div class="stopmeta">'+(missN?missN+' waiting for another try. Get one right on the first try to clear it.':'Nothing here yet. Questions you miss will collect here.')+'</div></div><button class="play" data-act="play" data-id="misses"'+(missN?'':' disabled')+'>Practice</button></div>';
 app.innerHTML=h;
}

function startRun(id){
 var items=[],name='',hw=false;
 if(id==='boss'){name='Mock Round';items=shuffle(ALLQ.filter(function(q){return q.id.indexOf('.')>0&&UNIT.stops.some(function(s){return q.id.indexOf(s.id+'.')===0;});})).slice(0,12);}
 else if(id==='misses'){name='My missed questions';items=shuffle(ALLQ.filter(function(q){return S.misses[q.id];})).slice(0,10);}
 else if(id.indexOf('hw:')===0){hw=true;var set=UNIT.hw.filter(function(x){return 'hw:'+x.id===id;})[0];name=set.name;items=shuffle(set.qs);}
 else{var s=UNIT.stops.filter(function(x){return x.id===id;})[0];name=s.name;items=shuffle(s.qs);}
 if(!items.length){view='trail';render();return;}
 run={id:id,name:name,hw:hw,items:items,i:0,phase:'main',redo:[],first:0,att:0,marks:[],opts:[],locked:false,t0:Date.now()};
 streak=0;clearInterval(timer);
 if(id==='boss'){timer=setInterval(tick,1000);}
 renderQ();
}
function tick(){var el=document.getElementById('clock');if(!el||!run||run.id!=='boss'){return;}var s=Math.floor((Date.now()-run.t0)/1000);el.textContent=mmss(s)+' of '+mmss(run.items.length*80);}
function cur(){return run.phase==='main'?run.items[run.i]:run.redo[run.i];}
function renderQ(){
 var q=cur();run.att=0;run.locked=false;run.opts=shuffle([q.a].concat(q.w));
 var dots='';run.items.forEach(function(x,k){var m=run.marks[k];dots+='<span class="dot'+(m==='ok'?' ok':m==='miss'?' miss':'')+(run.phase==='main'&&k===run.i?' now':'')+'"></span>';});
 var h='<div class="bar"><button class="back" data-act="'+(run.hw?'tab" data-v="hw':'home')+'">Back</button>'+(run.id==='boss'?'<span class="chip" id="clock">0:00</span>':'')+'<div class="dots" aria-hidden="true">'+dots+'</div></div><div class="card"><p class="area">'+esc(q.area)+(run.phase==='redo'?'<span class="redotag">Redo</span>':'')+'</p><p class="qtext">'+esc(q.q)+'</p>'+(q.fig?'<div class="fig">'+q.fig+'</div>':'')+'<div class="tiles">'+run.opts.map(function(o,k){return '<button class="tile" data-act="pick" data-k="'+k+'"><span class="k">'+'ABCD'.charAt(k)+'</span><span>'+esc(o)+'</span></button>';}).join('')+'</div><div class="feedback" id="fb" aria-live="polite"></div></div>';
 app.innerHTML=h;if(run.id==='boss'){tick();}
 window.scrollTo(0,0);
}
function recordMiss(q){S.misses[q.id]=(S.misses[q.id]||0)+1;save();}
function pick(k){
 if(run.locked){return;}var q=cur();var tiles=app.querySelectorAll('.tile');var fb=document.getElementById('fb');var ok=run.opts[k]===q.a;
 function setFb(cls,title,body){fb.className='feedback show '+cls;fb.innerHTML='<p class="fbtitle">'+title+'</p><p class="how">'+body+'</p>';}
 function nextBtn(){fb.innerHTML+='<button class="next" data-act="next">'+(isLast()?'Finish':'Next')+'</button>';}
 if(ok){
  tiles[k].classList.add('right');tiles.forEach(function(t){t.disabled=true;});run.locked=true;
  if(run.att===0){streak++;if(streak>S.bestStreak){S.bestStreak=streak;}if(run.phase==='main'){run.first++;run.marks[run.i]='ok';if(S.misses[q.id]){delete S.misses[q.id];}}save();setFb('good','Yes!','<b>Why:</b> '+esc(q.how));}
  else{if(run.phase==='main'){run.marks[run.i]='miss';run.redo.push(q);}recordMiss(q);setFb('good','You got it.','<b>Why:</b> '+esc(q.how));}
  nextBtn();
 }else{
  run.att++;tiles[k].classList.add('wrong','shake');tiles[k].disabled=true;streak=0;
  if(run.att===1){setFb('retry','Not quite.','Look again and try one more time.');}
  else{tiles.forEach(function(t,j){t.disabled=true;if(run.opts[j]===q.a){t.classList.add('right');}});run.locked=true;if(run.phase==='main'){run.marks[run.i]='miss';run.redo.push(q);}recordMiss(q);setFb('reveal','The answer is: '+esc(q.a),'<b>Why:</b> '+esc(q.how));nextBtn();}
 }
}
function isLast(){var list=run.phase==='main'?run.items:run.redo;if(run.i<list.length-1){return false;}return run.phase==='redo'||run.redo.length===0;}
function next(){
 var list=run.phase==='main'?run.items:run.redo;
 if(run.i<list.length-1){run.i++;renderQ();return;}
 if(run.phase==='main'&&run.redo.length>0){run.phase='redo';run.i=0;run.redo=run.redo.slice();renderQ();return;}
 finish();
}
function receiptText(){
 var st=S.hw[run.hwid]||{};var secs=Math.floor((run.t1-run.t0)/1000);
 return 'CYBER DEFENSE ACADEMY HOMEWORK RECEIPT\nName: '+(S.name||'(add your name)')+'\nUnit: '+UNIT.label+'\nSet: '+run.name+'\nScore: '+run.first+' of '+run.items.length+' correct on the first try\nAttempt number: '+(st.attempts||1)+'\nTime: '+mmss(secs)+'\nDate: '+new Date(run.t1).toLocaleString();
}
function finish(){
 clearInterval(timer);run.t1=Date.now();var total=run.items.length;var pct=run.first/total;var n=pct>=0.9?3:pct>=0.7?2:pct>=0.5?1:0;
 var stop=UNIT.stops.filter(function(s){return s.id===run.id;})[0];var isTrail=!!stop||run.id==='boss';
 var big='';for(var i=0;i<3;i++){big+=star(i<n);}
 if(run.hw){
  var setId=run.id.slice(3);run.hwid=setId;var prev=S.hw[setId]||{};S.hw[setId]={best:Math.max(prev.best||0,run.first),attempts:(prev.attempts||0)+1,last:run.first};save();
  app.innerHTML='<div class="card finish"><h2>Set complete</h2><p><b>'+run.first+' of '+total+'</b> correct on the first try. '+(pct>=0.8?'Nice work.':'Good effort. Try again to raise your score.')+'</p><p style="margin:14px 0 6px"><label>Your name <input class="txtin" type="text" id="rname" data-act-input="rname" value="'+esc(S.name||'')+'" placeholder="First and last name"></label></p><textarea id="rc" readonly rows="8" aria-label="Homework receipt">'+esc(receiptText())+'</textarea><div class="btnrow"><button class="next" data-act="copy">Copy receipt</button><button class="ghost" data-act="play" data-id="'+esc(run.id)+'">Try again</button><button class="ghost" data-act="tab" data-v="hw">Back to homework</button></div><p class="fine" id="cpmsg">Paste the receipt into the Learning Lab as your homework submission.</p></div>';
  window.scrollTo(0,0);return;
 }
 if(isTrail){var prev2=S.stops[run.id]||{};S.stops[run.id]={done:true,stars:Math.max(prev2.stars||0,n),best:Math.max(prev2.best||0,run.first)};save();}
 var msg=n===3?'Flawless!':n===2?'Strong work!':n===1?'Good start. Try again for more stars.':'Keep going. The explanations are the secret.';
 var time='';if(run.id==='boss'){time='<p>Time: '+mmss(Math.floor((run.t1-run.t0)/1000))+'. Exam pace for 12 questions is about 16:00.</p>';}
 var cleared=run.id==='misses'?'<p>Missed questions still waiting: <b>'+Object.keys(S.misses).length+'</b></p>':'';
 var tip=stop?'<div class="tip"><h3>Exam tip</h3><p style="margin:0">'+esc(stop.tip)+'</p></div>':'<div class="tip"><h3>Exam tip</h3><p style="margin:0">Read every answer choice before you pick. On the real exam, skip a tough question, move on, and come back to it. There is no penalty for guessing.</p></div>';
 app.innerHTML='<div class="card finish"><h2>Mission complete</h2><p class="area">'+esc(run.name)+'</p>'+(run.id==='misses'?'':'<div class="bigstars">'+big+'</div>')+'<p><b>'+run.first+' of '+total+'</b> correct on the first try. '+msg+'</p>'+time+cleared+tip+'<div class="btnrow"><button class="next" data-act="home">Back to the trail</button><button class="ghost" data-act="play" data-id="'+esc(run.id)+'">Replay</button></div></div>';
 if(n===3&&run.id!=='misses'){confetti();}
 window.scrollTo(0,0);
}

function renderFrq(){
 var h=header()+'<p class="fine">These are free-response practice prompts in the style of the exam’s Section II. Write your answer first, then check the model answer and score yourself honestly.</p>';
 UNIT.frq.forEach(function(f){
  var st=S.frq[f.id]||{t:{},open:{},self:{}};
  h+='<div class="card"><h3 class="sec">'+esc(f.title)+'</h3><p class="area">CED '+esc(f.lo)+'</p><div class="fig">'+f.src+'</div>';
  f.parts.forEach(function(p,j){
   var sf=st.self[j];var op=st.open[j];
   h+='<div class="part"><p><b>'+p.l+'</b> '+esc(p.p)+'</p><textarea data-act-input="frq" data-f="'+f.id+'" data-j="'+j+'" aria-label="Your answer for part '+p.l+'">'+esc(st.t[j]||'')+'</textarea><div class="selfrow"><button class="self" data-act="model" data-f="'+f.id+'" data-j="'+j+'">'+(op?'Hide model answer':'Show model answer')+'</button>';
   if(op){['Got it','Almost','Not yet'].forEach(function(l,m){var key=['got','almost','no'][m];h+='<button class="self'+(sf===key?' on':'')+'" data-act="self" data-f="'+f.id+'" data-j="'+j+'" data-s="'+key+'">'+l+'</button>';});}
   h+='</div>'+(op?'<div class="model"><b>Model answer:</b> '+esc(p.m)+'</div>':'')+'</div>';
  });
  h+='</div>';
 });
 app.innerHTML=h;
}

function render(){if(view==='trail'){renderTrail();}else if(view==='hw'){renderHw();}else{renderFrq();}}

document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b){return;}var act=b.getAttribute('data-act');
 if(act==='tab'){view=b.getAttribute('data-v');run=null;clearInterval(timer);render();window.scrollTo(0,0);}
 else if(act==='play'){startRun(b.getAttribute('data-id'));}
 else if(act==='home'){run=null;clearInterval(timer);view='trail';render();window.scrollTo(0,0);}
 else if(act==='pick'){pick(+b.getAttribute('data-k'));}
 else if(act==='next'){next();}
 else if(act==='copy'){var ta=document.getElementById('rc');var msg=document.getElementById('cpmsg');var done=function(){if(msg){msg.textContent='Copied. Paste it into the Learning Lab as your homework submission.';}};try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,function(){ta.select();try{document.execCommand('copy');done();}catch(x){}});}else{ta.select();document.execCommand('copy');done();}}catch(x){ta.select();if(msg){msg.textContent='Select the text above and copy it, then paste it into the Learning Lab.';}}}
 else if(act==='reset'){if(window.confirm('Reset all of your stars, homework, and progress on this device?')){S.stops={};S.hw={};S.misses={};S.bestStreak=0;save();render();}}
 else if(act==='theme'){S.theme=(S.theme==='light')?'dark':'light';save();applyTheme();}
 else if(act==='model'){var f=b.getAttribute('data-f'),j=b.getAttribute('data-j');S.frq[f]=S.frq[f]||{t:{},open:{},self:{}};S.frq[f].open[j]=!S.frq[f].open[j];save();renderFrq();}
 else if(act==='self'){var f2=b.getAttribute('data-f'),j2=b.getAttribute('data-j');S.frq[f2]=S.frq[f2]||{t:{},open:{},self:{}};S.frq[f2].self[j2]=b.getAttribute('data-s');save();renderFrq();}


});
document.addEventListener('input',function(e){
 var t=e.target;var a=t.getAttribute&&t.getAttribute('data-act-input');if(!a){return;}
 if(a==='frq'){var f=t.getAttribute('data-f'),j=t.getAttribute('data-j');S.frq[f]=S.frq[f]||{t:{},open:{},self:{}};S.frq[f].t[j]=t.value;save();}

 else if(a==='hwname'){S.name=t.value;save();}
 else if(a==='rname'){S.name=t.value;save();var rc=document.getElementById('rc');if(rc&&run){rc.value=receiptText();}}
});
render();
</script>
</body>
</html>
