<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://dhammer86-hue.github.io/WebPages/pilot-academy-app/app.css">
</head>
<body style="font-family:system-ui,sans-serif">
<div id="app"><p id="pilotmsg" style="text-align:center;margin-top:60px;font-size:20px;color:#4a5a75;background:#eef5fb;padding:20px;border-radius:12px">Loading Pilot Academy...</p></div>
<div id="modal" hidden></div>
<script>
window.PILOT_SHELL = true;
function pilotProblem(text) {
  var m = document.getElementById("pilotmsg");
  if (m) m.textContent = "Pilot Academy could not start. Please send this to your teacher: " + text;
}
window.addEventListener("error", function (e) { pilotProblem(e.message || "a file did not load"); });
</script>
<script src="https://dhammer86-hue.github.io/WebPages/pilot-academy-app/app.js" onerror="pilotProblem('app.js did not load')"></script>
</body>
</html>
